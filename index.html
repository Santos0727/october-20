// each house keeps a persistent 0-5 happiness meter that rises on fast
// deliveries and drops on slow/late ones — the goal is every house happy.
// Delivery speed vs the deadline window picks a 1-5 result, which shifts
// happiness by (stars - 3) * 0.25: 5★ +0.5, 4★ +0.25, 3★ 0, 2★ -0.25, 1★ -0.5
function rateOrder(o) {
  const window = o.dur || ORDER_DEADLINE;
  const elapsed = tSim - (o.deadline - window);
  const f = elapsed / window;
  const stars = f <= 0.4 ? 5 : f <= 0.6 ? 4 : f <= 0.8 ? 3 : f <= 1 ? 2 : 1;
  const h = o.house;
  if (h.happiness === undefined) h.happiness = 3;
  h.lastDelta = (stars - 3) * 0.25;
  h.happiness = THREE.MathUtils.clamp(h.happiness + h.lastDelta, 0, 5);
  h.ratingsN = (h.ratingsN || 0) + 1;
  // track delivery times for inspect stats
  h.timeSum = (h.timeSum || 0) + elapsed;
  h.timeN = (h.timeN || 0) + 1;
  h.timeMin = h.timeMin === undefined ? elapsed : Math.min(h.timeMin, elapsed);
  tintHouse(h);   // live-update building color in inspect mode
  return stars;
}
const fmtTime = s => s >= 60
  ? `${(s / 60) | 0}m ${Math.round(s % 60)}s`
  : `${Math.round(s)}s`;

// inspect mode: tint a house's materials by happiness (red -> green)
function tintHouse(h) {
  if (!h.mats) return;
  const show = inspectMode && h.happiness !== undefined;
  const hap = new THREE.Color().setHSL(
    (h.happiness === undefined ? 3 : h.happiness) / 5 * 0.33, 0.7, 0.55);
  for (const it of h.mats) {
    if (!show) { it.m.color.copy(it.orig); continue; }
    it.m.color.copy(it.orig).lerp(hap, 0.55);
  }
}
function tintAllHouses() {
  for (const h of houses) if (!h.dead) tintHouse(h);
}

// warehouse rating: its own 0-5 star meter, nudged by every completed order
function warehouseRate(stars) {
  const d = (stars - 3) * 0.08;
  if (!d) return;
  WH.stars = THREE.MathUtils.clamp(WH.stars + d, 0, 5);
  const el = document.createElement('div');
  el.className = 'pop recv';
  el.style.borderColor = '#ffb066';
  el.textContent = `${d > 0 ? '+' : '-'}★ ${WH.stars.toFixed(1)}`;
  document.body.appendChild(el);
  recvPops.push({ x: WH.x, z: WH.z, el, born: tSim });
}
// each rider keeps its own 0-5 rating, shifted by the stars houses give
function rateRider(c, stars) {
  if (c.rep === undefined) c.rep = 3;
  c.rep = THREE.MathUtils.clamp(c.rep + (stars - 3) * 0.25, 0, 5);
  c.repN = (c.repN || 0) + 1;
}
// warehouse parcel cap upgrade: +5 parcels per level, $50 then +$25 each
WH.upg = 0;
const warehouseCap = () => 20 + 5 * WH.upg;
const upgCost = () => 50 + 25 * WH.upg;
const MAX_UPG = 10;
// happiness delta as popup text: "+happiness" / "-happiness"
function hapText(h) {
  const d = h.lastDelta || 0;
  if (d > 0) return `+happiness ${d.toFixed(2)}`;
  if (d < 0) return `-happiness ${(-d).toFixed(2)}`;
  return 'happiness —';
}

function completeDelivery(c) {
  // uber ride: passenger pays the fare into the green uber hub funds
  if (c.uber && c.uber.phase === 'toDest') {
    const uo = c.uber.order;
    const onTime = tSim <= uo.deadline;
    const earned = Math.round(uo.pay * (onTime ? 1 : LATE_PAY));
    const tip = Math.round(uo.pay * (onTime ? TIP_ON_TIME : TIP_LATE));
    UW.funds += earned + tip;
    trips++;
    const ix = uberOrders.indexOf(uo);
    if (ix >= 0) uberOrders.splice(ix, 1);
    const stars = rateOrder({ dur: uo.dur, deadline: uo.deadline, house: uo.to });
    warehouseRate(stars);
    rateRider(c, stars);
    riderStat(c, tSim - (c.legT0 || tSim));
    awardXp(c, Math.round(XP_UBER * (onTime ? XP_HURRY : 1)));
    dayStats.money += earned + tip;
    const el = document.createElement('div');
    el.className = 'pop recv';
    el.style.borderColor = '#7dff9a';
    el.textContent = `Uber ride +$${earned + tip} (tip $${tip}) · ${hapText(uo.to)}`;
    document.body.appendChild(el);
    recvPops.push({ x: uo.to.x, z: uo.to.z, el, born: tSim });
    c.uber = null;
    refreshOrderVisuals();
    return;
  }
  // food delivery: customer pays into the blue food hub funds
  if (c.food && c.food.phase === 'toHouse') {
    const fo = c.food.order;
    const onTime = tSim <= fo.deadline;
    const earned = Math.round(fo.pay * (onTime ? 1 : LATE_PAY));
    const tip = Math.round(fo.pay * (onTime ? TIP_ON_TIME : TIP_LATE));
    FW.funds += earned + tip;
    trips++;
    const ix = foodOrders.indexOf(fo);
    if (ix >= 0) foodOrders.splice(ix, 1);
    const stars = rateOrder(fo);
    warehouseRate(stars);
    rateRider(c, stars);
    riderStat(c, tSim - (c.legT0 || tSim));
    awardXp(c, Math.round(XP_FOOD * (onTime ? XP_HURRY : 1)));
    dayStats.money += earned + tip;
    const el = document.createElement('div');
    el.className = 'pop recv';
    el.style.borderColor = '#6fb7ff';
    el.textContent = `Food delivered +$${earned + tip} (tip $${tip}) · ${hapText(fo.house)}`;
    document.body.appendChild(el);
    recvPops.push({ x: fo.house.x, z: fo.house.z, el, born: tSim });
    c.food = null;
    refreshOrderVisuals();
    return;
  }
  const stop = c.delivery.stop;
  stop.order.delivered += stop.count;
  stop.order.reserved = Math.max(0, (stop.order.reserved || 0) - stop.count);
  const onTime = tSim <= stop.order.deadline;
  const rate = onTime ? 1 : LATE_PAY;
  const base = stop.count * PARCEL_PAY * (stop.order.payMul || 1);
  const earned = Math.round(base * rate);
  const tip = Math.round(base * (onTime ? TIP_ON_TIME : TIP_LATE));
  c.cashLoad = (c.cashLoad || 0) + earned + tip;
  trips++;
  riderStat(c, tSim - (c.legT0 || tSim), stop.count);
  awardXp(c, Math.round(XP_PARCEL * stop.count * (onTime ? XP_HURRY : 1)));
  const done = stop.order.delivered >= stop.order.parcels;
  let stars = 0;
  if (done) {
    const ix = orders.indexOf(stop.order);
    if (ix >= 0) orders.splice(ix, 1);
    stars = rateOrder(stop.order);
    warehouseRate(stars);
    rateRider(c, stars);
    dayStats.parcels += stop.count;
    dayStats.money += earned + tip;
  }
  const el = document.createElement('div');
  el.className = 'pop recv';
  el.textContent = `Received +$${earned + tip} (tip $${tip})` +
    (stars ? ` · ${hapText(stop.order.house)}` : '');
  document.body.appendChild(el);
  recvPops.push({ x: stop.house.x, z: stop.house.z, el, born: tSim });
  c.stopIdx++;
  refreshOrderVisuals();
}

function riderArrive(c) {
  if (c.idle) return;
  if (c.returning) {           // back at the warehouse: deposit earnings
    c.returning = false; c.idle = true;
    WH.funds += c.cashLoad || 0;
    c.cashLoad = 0;
    return;                     // stay parked where the path ended
  }
  // ---- food job legs ----
  if (c.food) {
    if (c.food.phase === 'toRestaurant') {
      // picked up the order — a worker hands it over, then head to the house
      const person = makePerson();
      person.position.set(c.food.order.restaurant.x, 0, c.food.order.restaurant.z);
      scene.add(person);
      c.delivery = { stop: { house: c.food.order.restaurant }, person, t: 0, paid: false };
      c.dwell = 3.5;
      c.dwellNext = false;
      return;
    }
    // arrived at the customer's house — hand over the food
    const person = makePerson();
    person.position.set(c.food.order.house.x, 0, c.food.order.house.z);
    scene.add(person);
    c.delivery = { stop: { house: c.food.order.house }, person, t: 0, paid: false };
    c.dwell = 6;
    c.dwellNext = false;
    return;
  }
  // ---- uber job legs ----
  if (c.uber) {
    const uo = c.uber.order;
    if (c.uber.phase === 'toPickup') {
      c.dwell = 3;                      // passenger boards, no payment
      c.dwellNext = false;
      return;
    }
    // arrived at the destination — passenger steps out at the house
    if (uo.person) {
      if (uo.person.parent) uo.person.parent.remove(uo.person);
      scene.add(uo.person);
      uo.person.position.set(uo.to.x, 0, uo.to.z);
      uo.person.rotation.set(0, Math.PI, 0);
      c.delivery = { stop: { house: uo.to }, person: uo.person, t: 0, paid: false, static: true };
    }
    c.dwell = 6;
    c.dwellNext = false;
    return;
  }
  const stop = c.stops[c.stopIdx];
  if (!stop) { c.dwellNext = false; c.dwell = 0.01; return; }
  // customer walks out to the rider and back; "Received" shows on return
  const person = makePerson();
  person.position.set(stop.house.x, 0, stop.house.z);
  scene.add(person);
  c.delivery = { stop, person, t: 0, paid: false };
  c.dwell = 6;
  c.dwellNext = (c.stopIdx + 1) < c.stops.length;
}

// path for an idle rider (parked at the warehouse) to a destination node
function idlePathTo(dest, rider) {
  const route = bfsPath(WH.node, dest);
  const park = rider
    ? riderParkPos(cars.filter(r => r.role === 'rider').indexOf(rider))
    : { x: WH.x, z: WH.z + 10 };
  let p = route ? buildLegs(route, { x: park.x, z: park.z }) : null;
  if (!p) p = buildLegs([WH.node, adj[WH.node][0]], { x: park.x, z: park.z });
  return p;
}

function setCarPath(c, p) {
  c.path = p; c.s = 0; c.li = 0; c.speed = 0; c.edge = null;
  c.stuck = 0; c.yieldLatch = false; c.dwell = 0; c.delivery = null;
}

// release parcel reservations a rider is no longer carrying
function releaseStops(c) {
  if (c.stops) for (let i = c.stopIdx || 0; i < c.stops.length; i++) {
    const st = c.stops[i];
    st.order.reserved = Math.max(0, (st.order.reserved || 0) - st.count);
  }
  c.stops = []; c.stopIdx = 0;
}

// assign the oldest accepted food order to a rider: restaurant -> house
function assignFoodJob(rider) {
  if (!FW.unlocked) return false;
  const fo = foodOrders.find(o => o.stage === 'accepted');
  if (!fo) return false;
  const p = idlePathTo(fo.restaurant.node, rider);
  if (!p) return false;
  const rd = dockPoint(fo.restaurant);
  appendLeg(p, rd.x, rd.z);            // pull into the restaurant lot
  fo.stage = 'enroute';
  rider.food = { order: fo, phase: 'toRestaurant' };
  // release any parcel reservations this rider was carrying
  if (rider.stops) for (let i = rider.stopIdx || 0; i < rider.stops.length; i++) {
    const st = rider.stops[i];
    st.order.reserved = Math.max(0, (st.order.reserved || 0) - st.count);
  }
  rider.stops = []; rider.stopIdx = 0; rider.returning = false;
  setCarPath(rider, p);
  rider.legT0 = tSim;
  rider.idle = false;
  return true;
}

// assign the oldest accepted uber ride: rider -> pickup house -> dropoff house
function assignUberJob(rider) {
  if (!UW.unlocked) return false;
  const uo = uberOrders.find(o => o.stage === 'accepted');
  if (!uo) return false;
  const p = idlePathTo(uo.from.node, rider);
  if (!p) return false;
  const d = dockPoint(uo.from);
  appendLeg(p, d.x, d.z);                // pull into the pickup house's lot
  uo.stage = 'enroute';
  rider.uber = { order: uo, phase: 'toPickup' };
  // release any parcel reservations this rider was carrying
  if (rider.stops) for (let i = rider.stopIdx || 0; i < rider.stops.length; i++) {
    const st = rider.stops[i];
    st.order.reserved = Math.max(0, (st.order.reserved || 0) - st.count);
  }
  rider.stops = []; rider.stopIdx = 0; rider.returning = false; rider.food = null;
  setCarPath(rider, p);
  rider.legT0 = tSim;
  rider.idle = false;
  return true;
}

function riderAdvance(c) {
  // food job state machine
  if (c.food) {
    if (c.food.phase === 'toRestaurant') {
      // pickup done — ride to the customer's house
      const p = routeFrom(c, c.food.order.house.node);
      if (p) {
        const d = dockPoint(c.food.order.house);
        appendLeg(p, d.x, d.z);        // pull into the customer's lot
        setCarPath(c, p);
        c.food.phase = 'toHouse';
        c.legT0 = tSim;                 // delivery clock starts at pickup
        return;
      }
      c.food.order.stage = 'accepted';   // couldn't route — release the order
      c.food = null;
    } else {
      c.food = null;                      // delivery finished in completeDelivery
    }
  }
  // uber job state machine
  if (c.uber) {
    if (c.uber.phase === 'toPickup') {
      // passenger boards — brief stop, then ride to the destination house
      const p = routeFrom(c, c.uber.order.to.node);
      if (p) {
        const d = dockPoint(c.uber.order.to);
        appendLeg(p, d.x, d.z);
        setCarPath(c, p);
        c.uber.phase = 'toDest';
        c.legT0 = tSim;
        // the waiting passenger hops on behind the rider
        const uo = c.uber.order;
        if (uo.person) {
          if (uo.person.parent) uo.person.parent.remove(uo.person);
          c.grp.add(uo.person);
          uo.person.position.set(0, 0, -1.7);
          uo.person.rotation.set(0, 0, 0);
        }
        return;
      }
      c.uber.order.stage = 'accepted';    // couldn't route — release the ride
      c.uber = null;
    } else {
      c.uber = null;                      // delivery finished in completeDelivery
    }
  }
  // food jobs take priority for free riders, then uber rides, then parcels
  if (assignFoodJob(c)) return;
  if (assignUberJob(c)) return;
  if (c.dwellNext && c.stops && c.stops[c.stopIdx]) {
    const stop = c.stops[c.stopIdx];
    if (shouldWalk(c, stop)) { startFootDelivery(c, stop); return; }
    if (goStop(c, stop)) return;
    releaseStops(c);              // can't route — drop the remaining stops
  }
  // batch finished -> ride back to the warehouse node (on the roads)
  const p = routeFrom(c, WH.node);
  if (!p) { releaseStops(c); c.idle = true; return; }
  const park = riderParkPos(cars.filter(r => r.role === 'rider').indexOf(c));
  appendLeg(p, park.x, park.z);          // pull into the warehouse lot
  setCarPath(c, p);
  c.returning = true;
}

// try to put one rider to work: food job first, else parcel stops
function dispatchRiderNow(rider) {
  if (rider.role !== 'rider' || !rider.idle) return false;
  if (assignFoodJob(rider)) return true;
  if (assignUberJob(rider)) return true;
  if (warehouseStock() <= 0) return false;
  const stops = [];
  let cap = rider.cap || 10;
  for (const o of orders) {
    if (o.stage !== 'atWarehouse') continue;
    const avail = o.parcels - o.delivered - (o.reserved || 0);
    const cnt = Math.min(avail, cap);
    if (cnt <= 0) continue;
    o.reserved = (o.reserved || 0) + cnt;   // reserve so other riders can't take it
    stops.push({ order: o, house: o.house, count: cnt });
    cap -= cnt;
    if (cap <= 0) break;
  }
  if (!stops.length) return false;
  const p = idlePathTo(stops[0].house.node, rider);
  if (!p) return false;
  const d = dockPoint(stops[0].house);
  appendLeg(p, d.x, d.z);              // pull into the customer's lot
  rider.stops = stops; rider.stopIdx = 0; rider.returning = false;
  rider.food = null;
  if (shouldWalk(rider, stops[0])) {
    rider.idle = false;
    startFootDelivery(rider, stops[0]);
    return true;
  }
  setCarPath(rider, p);
  rider.legT0 = tSim;
  rider.idle = false;
  return true;
}

// auto-dispatch (paid upgrade): keeps idle riders working automatically
let autoDispatch = false;
function dispatchRider() {
  for (const rider of cars) dispatchRiderNow(rider);
}

function gameTick(dt) {
  orderTimer += dt;
  if (orderTimer > 4) { orderTimer = 0; tryCreateOrder(); }
  foodTimer += dt;
  if (foodTimer > 7) { foodTimer = 0; tryCreateFoodOrder(); }
  uberTimer += dt;
  if (uberTimer > 12) { uberTimer = 0; tryCreateUberOrder(); }
  eventTimer += dt;
  if (eventTimer > 35) {
    eventTimer = 0;
    if (roadEvents.length < 2 && rng() < 0.65) spawnRoadEvent();
  }
  updateRepairs(dt);
  // sea freight: accepted orders sail to their port's pier on cargo ships
  for (const o of orders) {
    if (o.stage !== 'waitShip') continue;
    const p = PORTS[o.port], cap = shipCap(p);
    let s = ships.find(s => s.port === p && s.state === 'sail' &&
                            s.orders.length < cap);
    if (!s) {
      const busy = ships.filter(s => s.port === p &&
        (s.state === 'sail' || s.state === 'dock')).length;
      if (busy >= portMaxShips(p)) continue;
      spawnShip(p); s = ships[ships.length - 1];
    }
    s.orders.push(o); o.stage = 'onShip';
  }
  // pier shuttles: each port keeps hub trucks parked at its hub and sends
  // them to the dock when the ship has unloaded orders there
  for (const p of PORTS) {
    while (cars.filter(c => c.role === 'hubtruck' && c.port === p).length <
           portHubTrucks(p)) spawnHubTruck(p);
    const docked = orders.filter(o => o.stage === 'atDock' &&
                                       PORTS[o.port] === p).length;
    for (let need = Math.ceil(docked / hubTruckCap(p)); need > 0; need--)
      for (const c of cars)
        if (c.role === 'hubtruck' && c.port === p && c.state === 'idleHub') {
          sendHubTruck(c); break;
        }
  }
  // live speed refresh so upgrades apply to trucks already on the road
  for (const c of cars) {
    if (c.role === 'truck') c.vmax = truckSpeed();
    else if (c.role === 'hubtruck') c.vmax = hubTruckSpeed(c.port);
  }
  // supply trucks: truck hub -> parcel warehouse -> truck hub.
  // Pier shuttles deliver all ports' cargo here, so loads can mix ports.
  let trucks = 0;
  for (const c of cars) if (c.role === 'truck') trucks++;
  while (trucks < MAX_TRUCKS) {
    const cap = truckParcelCap(), load = [];
    let pcs = 0;
    for (const o of orders) {
      if (o.stage !== 'atTH' && o.stage !== 'atHub') continue;
      const left = o.parcels - o.delivered - (o.reserved || 0);
      if (left <= 0 || (load.length && pcs + left > cap)) continue;
      load.push(o); pcs += left;
      if (pcs >= cap) break;
    }
    if (!load.length || !spawnTruck(load)) break;
    for (const o of load) o.stage = 'onTruck';
    trucks++;
  }
  if (autoDispatch) dispatchRider();
}

// --- overpass: an arterial road carried over another at mid-block ---
{
  let best = null;
  for (const e of edges) {
    if (!e.fast && e.roadW === ARTERIAL_W && (!best || e.len > best.len)) best = e;
  }
  if (best) {
    const na = nodes[best.a], nb = nodes[best.b];
    const mx = (na.x + nb.x) / 2, mz = (na.z + nb.z) / 2;
    const g = new THREE.Group();
    g.position.set(mx, 0, mz);
    // local X = along road, local Z = across (bridge direction)
    g.rotation.y = Math.atan2(-best.d.z, best.d.x);
    const conc = new THREE.MeshLambertMaterial({ color: 0x9aa4ae });
    const roadMat = new THREE.MeshLambertMaterial({ color: 0x3c4148 });
    const span = best.roadW + 6;          // crosses the road + a little verge
    const deckW = 9;                       // width of the bridge carrying road
    const deck = new THREE.Mesh(new THREE.BoxGeometry(deckW, 1.2, span), roadMat);
    deck.position.y = 6.1; deck.castShadow = deck.receiveShadow = true;
    g.add(deck);
    // railings + edge lines
    const railMat = new THREE.MeshLambertMaterial({ color: 0xd8dee6 });
    for (const zz of [-span / 2 + 0.3, span / 2 - 0.3]) {
      const rail = new THREE.Mesh(new THREE.BoxGeometry(deckW + 0.4, 0.9, 0.35), railMat);
      rail.position.set(0, 7.1, zz); g.add(rail);
    }
    for (const xx of [-deckW / 2 + 0.25, deckW / 2 - 0.25]) {
      const line = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.06, span - 1),
        new THREE.MeshBasicMaterial({ color: 0xf2c230 }));
      line.position.set(xx, 6.75, 0); g.add(line);
    }
    // support pillars at both ends
    for (const zz of [-span / 2 + 1.2, span / 2 - 1.2])
      for (const xx of [-deckW / 2 + 1, deckW / 2 - 1]) {
        const p = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.9, 5.4, 8), conc);
        p.position.set(xx, 2.7, zz); p.castShadow = true; g.add(p);
      }
    scene.add(g);
  }
}

function updateCars(dt) {
  updateEvents(dt);
  updateShips(dt);
  jamNow.clear();
  jamEdgeNow.clear();
  if (cars.length < densityTarget) {
    const attempts = Math.min(4, densityTarget - cars.length);
    for (let k = 0; k < attempts; k++) spawnCar();
  } else if (cars.length > densityTarget + 10) {
    // cull surplus traffic cars only — never special vehicles (riders, trucks…)
    let i = cars.length - 1;
    while (i >= 0 && cars[i].role) i--;
    const c = i >= 0 ? cars.splice(i, 1)[0] : cars.pop();
    scene.remove(c.grp);
  }

  const sigCache = new Map();
  const sig = id => {
    if (!sigCache.has(id)) sigCache.set(id, signalAt(id, tSim));
    return sigCache.get(id);
  };

  // rebuild the neighbor grid once per tick — positions are from last frame,
  // which is fine since cars move < 1m per tick
  carGridMap = new Map();
  for (const c of cars) {
    if (c.px === undefined) continue;
    const k = Math.floor(c.px / CAR_CELL) + ',' + Math.floor(c.pz / CAR_CELL);
    const b = carGridMap.get(k);
    if (b) b.push(c); else carGridMap.set(k, [c]);
  }

  for (const c of cars) {
    if (c.idle) continue;
    if (c.foot) { updateFoot(c, dt); continue; }
    // parked at a delivery stop: customer walks out, hands over parcel,
    // walks back -> "Received" -> rider leaves after ~6s total
    if (c.dwell > 0) {
      c.dwell -= dt;
      const d = c.delivery;
      if (d) {
        d.t += dt;
        const hp = d.stop.house;
        let px = hp.x, pz = hp.z, dirX = 0, dirZ = 1, moving = false;
        if (d.static) { /* on-foot delivery: customer stays at the door */ }
        else if (d.t < 2.5) {               // house -> rider
          const u = d.t / 2.5;
          px = hp.x + (c.px - hp.x) * u; pz = hp.z + (c.pz - hp.z) * u;
          dirX = c.px - hp.x; dirZ = c.pz - hp.z; moving = true;
        } else if (d.t < 5) {              // rider -> house
          const u = (d.t - 2.5) / 2.5;
          px = c.px + (hp.x - c.px) * u; pz = c.pz + (hp.z - c.pz) * u;
          dirX = hp.x - c.px; dirZ = hp.z - c.pz; moving = true;
        }
        d.person.position.set(px, 0, pz);
        if (moving) d.person.rotation.y = Math.atan2(dirX, dirZ);
        if (d.t >= 5 && !d.paid) { d.paid = true; completeDelivery(c); }
      }
      if (c.dwell <= 0) {
        c.dwell = 0;
        if (c.delivery) { scene.remove(c.delivery.person); c.delivery = null; }
        riderAdvance(c);
      }
      continue;
    }
    // police on scene: count down the manage window, then head home
    if (c.role === 'police' && c.state === 'managing') {
      c.manage -= dt;
      if (c.manage <= 0) {
        const p = routeFrom(c, c.home);
        c.state = 'returning';
        if (p) {
          c.path = p; c.s = 0; c.li = 0; c.speed = 0; c.edge = null;
          c.stuck = 0; c.yieldLatch = false;
        } else c.dead = true;
      }
      continue;
    }
    if (!c.path) continue;
    while (c.li < c.path.legs.length - 1 && c.s >= c.path.cum[c.li + 1] - 1e-4) c.li++;
    const leg = c.path.legs[c.li];
    const legLen = Math.max(1e-5, c.path.cum[c.li + 1] - c.path.cum[c.li]);
    const u = THREE.MathUtils.clamp((c.s - c.path.cum[c.li]) / legLen, 0, 1);
    c.edge = leg.edge;

    const roadMul = leg.edge && leg.edge.fast ? 1.4 : 1;
    // road events: closed lanes crawl, festival crowds slow nearby traffic
    let evMul = 1;
    if (leg.edge && leg.edge.until > tSim) evMul = Math.min(evMul, leg.edge.eventMul || 1);
    for (const ev of roadEvents) {
      if (ev.type === 'festival' && ev.until > tSim &&
          (ev.x - c.px) ** 2 + (ev.z - c.pz) ** 2 < ev.r * ev.r)
        evMul = Math.min(evMul, 0.55);
    }
    const vmaxEff = c.vmax * roadMul * evMul;

    // Deadlock declog — lane-based round robin.
    // Each intersection rotates an "authorized push" window across its 4
    // approach lanes (~6s each, staggered per node). A car stuck in the box
    // whose approach lane is currently authorized ignores car-following and
    // creeps through; the latch keeps it going until it leaves the box.
    // 15s failsafe yields regardless of lane.
    // distance to the end of the current EDGE, not just this leg — curved
    // and bridge edges are split into many sub-legs and must not trigger
    // intersection logic mid-edge
    let edgeEndIdx = c.li;
    while (edgeEndIdx + 1 < c.path.legs.length &&
           c.path.legs[edgeEndIdx + 1].eidx === leg.eidx &&
           c.path.legs[edgeEndIdx + 1].edge) edgeEndIdx++;
    const remEdge = c.path.cum[edgeEndIdx + 1] - c.s;
    const boxHalf = (leg.edge ? leg.edge.roadW : 10) / 2 + 2;
    const inBox = !leg.edge || remEdge < boxHalf;

    // road closed under us or just ahead -> reroute at the next node
    // instead of driving into the closure
    const shutE = e2 => e2 && e2.noRoute && tSim < e2.until;
    const nxtE = c.path.edgeList[leg.eidx + 1];
    const curE = leg.edge || c.path.edgeList[leg.eidx];
    if (remEdge < 5 && (shutE(curE) || shutE(nxtE)) && divertCar(c, leg.eidx)) continue;
    if (c.speed < 0.4) c.stuck += dt; else c.stuck = 0;
    if (!inBox) c.yieldLatch = false;

    const incEdge = c.path.edgeList[leg.eidx];      // incoming edge = approach lane
    // off-road legs (pier runs) have no graph edge — skip intersection logic
    const nodeId = leg.edge ? leg.edge.b : (incEdge && incEdge.b);
    let yieldMode = false;
    if (nodeId !== undefined && nodeId !== null && nodeId >= 0) {
      const h = Math.round((nodes[nodeId].x + nodes[nodeId].z) / 40);
      const phaseOff = (((h % 4) + 4) % 4) * 1.5;
      const laneIdx = Math.floor((tSim + phaseOff) / 6) % 4;
      const ad = incEdge.d;
      const laneOK = DIRS[laneIdx].x === ad.x && DIRS[laneIdx].z === ad.z;

      // count stuck cars per intersection AND per edge — mid-block jams
      // (a bus or truck stalled mid-lane) never reach an intersection box
      if (leg.edge && c.stuck > 4) {
        jamEdgeNow.set(leg.edge, (jamEdgeNow.get(leg.edge) || 0) + 1);
        if (inBox) jamNow.set(nodeId, (jamNow.get(nodeId) || 0) + 1);
      }

      if (inBox && ((c.stuck > 3 && laneOK) || c.stuck > 15)) c.yieldLatch = true;
      yieldMode = !!c.yieldLatch;
    }

    let desired = vmaxEff;

    // corner slowdown zones
    for (const sl of c.path.slows) {
      const dAhead = sl.d - c.s;
      if (dAhead > -1 && dAhead < 7) { desired = Math.min(desired, sl.v); break; }
    }

    // traffic signal / right-of-way at the upcoming node
    // emergency vehicles (police/fire) run lights so they can reach a scene
    if (leg.edge && c.role !== 'police' && c.role !== 'fire') {
      const rem = remEdge;
      const stopGap = leg.edge.roadW / 2 + 1.5;
      if (rem > stopGap + 0.5 && rem < 26) {
        const endNode = leg.edge.b;
        const asp = sig(endNode)[leg.edge.axis];
        const dg = declogs.get(endNode);
        const free = !!(dg && tSim < dg.until);   // police-managed push window
        let mayGo = free || asp === 'g' || (asp === 'y' && rem < stopGap + 4);

        if (mayGo && !free) {
          const nextEdge = c.path.edgeList[leg.eidx + 1];
          const turning = nextEdge &&
            (nextEdge.d.x !== leg.edge.d.x || nextEdge.d.z !== leg.edge.d.z);
          if (nextEdge) {
            let blocked = !exitClear(c);
            // turning traffic yields to oncoming vehicles at the node
            // (only counts oncoming that is actually moving)
            if (!blocked && turning) {
              const d = leg.edge.d;
              const nx = nodes[endNode].x, nz = nodes[endNode].z;
              nearCars(nx, nz, 42, o => {
                if (o === c || o.speed < 1.5 || !o.path) return false;
                if (Math.abs(o.grp.position.y - c.grp.position.y) > 1.2) return false;
                const ol = o.path.legs[o.li];
                if (!ol) return false;
                if (ol.edge && ol.edge.b === endNode &&
                    ol.edge.d.x === -d.x && ol.edge.d.z === -d.z &&
                    o.path.cum[o.li + 1] - o.s < 34) { blocked = true; return true; }
                return false;
              });
            }
            if (blocked) {
              // patience: don't wait forever — after ~6s proceed anyway and
              // let the in-box yield/proximity rules resolve the conflict
              c.waitT = (c.waitT || 0) + dt;
              if (c.waitT > 6) mayGo = true;
            } else {
              c.waitT = 0;
            }
          }
        } else {
          c.waitT = 0;
        }
        if (!mayGo) {
          const dStop = rem - stopGap;
          desired = Math.min(desired, THREE.MathUtils.clamp(dStop / 11, 0, 1) * vmaxEff * 0.85);
        }
      }
    }

    // Proximity car-following — the leader scan runs for every non-emergency
    // car so push-through modes can still enforce a bumper gap instead of
    // driving through (and stacking on) the car ahead
    if (c.role !== 'police' && c.role !== 'fire') {
      const onTurnLeg = !leg.edge && c.path.edgeList[leg.eidx + 1];
      const dl = Math.hypot(leg.b.x - leg.a.x, leg.b.z - leg.a.z) || 1;
      const fx = (leg.b.x - leg.a.x) / dl, fz = (leg.b.z - leg.a.z) / dl;
      let bestGap = Infinity, leaderSpeed = 0, leaderLen = 4.3, leaderAlign = 1;
      const myLen = c.vlen || 4.3;
      nearCars(c.px, c.pz, 15, o => {
        if (o === c) return false;
        if (Math.abs(o.grp.position.y - c.grp.position.y) > 1.2) return false; // different level
        const rx = o.px - c.px, rz = o.pz - c.pz;
        const df = rx * fx + rz * fz;
        if (df < 0.5 || df >= bestGap || df > 14) return false;
        const lat = Math.abs(rx * fz - rz * fx);
        const align = o.dx * fx + o.dz * fz;
        if (align > 0.5) {
          if (lat > 2.3) return false;
        } else if (Math.abs(align) <= 0.5) {
          if (inBox ? (df > 5 || lat > 3) : (df > 5.5 || lat > 2.3)) return false;
        } else {
          if (!(onTurnLeg && df < 8 && lat < 3)) return false;
        }
        bestGap = df; leaderSpeed = o.speed; leaderLen = o.vlen || 4.3;
        leaderAlign = align;
        return false;
      });
      const need = Math.max(myLen, leaderLen) + 0.4;
      const edgePush = leg.edge && (edgeDeclogs.get(leg.edge) || 0) > tSim;
      // police-managed intersection: signals are free AND crossing conflicts
      // inside the box stop blocking — this is what actually breaks deadlocks
      const nodePush = leg.edge && (() => {
        const d = declogs.get(leg.edge.b);
        return !!(d && tSim < d.until);
      })();
      if (yieldMode) {
        // Authorized lane pushing through — only a same-direction leader
        // (real bumper risk) can stop it; crossing cars get flowed around
        desired = Math.min(desired, 3.2);
        if (bestGap < 2.2 && leaderAlign > 0.5) desired = 0;
      } else if (edgePush) {
        // mid-block declog: hurry the queue, same-direction gap still enforced
        desired = Math.min(desired, 4.5);
        if (bestGap < need * 0.55 && leaderAlign > 0.5) desired = 0;
      } else if (bestGap < 14) {
        // keep a real bumper gap scaled to the longer of the two vehicles.
        // During a police-managed window a crossing/oncoming leader doesn't
        // slow us at all — that's what lets two streams unstick
        const crossLeader = nodePush && leaderAlign <= 0.5;
        if (!crossLeader) {
          if (bestGap < need) desired = 0;
          else desired = Math.min(desired, THREE.MathUtils.clamp(
            leaderSpeed + (bestGap - need - 1.8) * 1.5, 0, vmaxEff));
        }
      }
    }
    // emergency vehicles (police/fire) ignore traffic entirely

    // integrate speed
    const accel = desired > c.speed ? 2.6 : 5.5;
    c.speed += THREE.MathUtils.clamp(desired - c.speed, -accel * dt, accel * dt);
    if (c.speed < 0) c.speed = 0;
    c.s += c.speed * dt;

    if (c.s >= c.path.total) { arrive(c); continue; }

    // pose
    const l = c.path.legs[c.li];
    const uu = THREE.MathUtils.clamp((c.s - c.path.cum[c.li]) / legLen, 0, 1);
    const px = l.a.x + (l.b.x - l.a.x) * uu;
    const pz = l.a.z + (l.b.z - l.a.z) * uu;
    const py = l.a.y + (l.b.y - l.a.y) * uu;
    c.grp.position.set(px, py, pz);
    c.px = px; c.pz = pz;
    const dx = l.b.x - l.a.x, dz = l.b.z - l.a.z;
    const dl2 = Math.hypot(dx, dz);
    if (dl2 > 1e-4) {
      c.dx = dx / dl2; c.dz = dz / dl2;
      const targetYaw = Math.atan2(dx, dz);
      let dyaw = targetYaw - c.yaw;
      dyaw = Math.atan2(Math.sin(dyaw), Math.cos(dyaw));
      c.yaw += dyaw * Math.min(1, dt * 9);
      const targetPitch = -Math.atan2(l.b.y - l.a.y, dl2);
      c.pitch = (c.pitch || 0) + (targetPitch - (c.pitch || 0)) * Math.min(1, dt * 6);
    }
    c.grp.rotation.y = c.yaw;
    if (c.grp.rotation.order !== 'YXZ') c.grp.rotation.order = 'YXZ';
    c.grp.rotation.x = c.pitch || 0;
  }
  // remove trucks that have left the city
  for (let i = cars.length - 1; i >= 0; i--) {
    if (cars[i].dead) { scene.remove(cars[i].grp); cars.splice(i, 1); }
  }

  // ---- jam bookkeeping: sustained clogs earn a police declog ----
  // only cops actually working count — a cop driving home frees the slot
  const cops = cars.filter(c => c.role === 'police' &&
    (c.state === 'toJam' || c.state === 'managing'));
  for (const [nid, cnt] of jamNow) {
    if (cnt < JAM_NEED) continue;
    let j = jamAcc.get(nid);
    if (!j) { j = { t: 0, cd: 0 }; jamAcc.set(nid, j); }
    j.t += dt;
    if (j.t >= JAM_TIME && tSim > j.cd && !declogs.has(nid) && cops.length < MAX_COPS)
      startDeclog(nid, j);
  }
  for (const [nid, j] of jamAcc)
    if (!jamNow.has(nid)) j.t = Math.max(0, j.t - dt * 2);   // jam eased -> cool off
  for (const [nid, dg] of declogs)
    if (tSim >= dg.until) declogs.delete(nid);
  // same for mid-block edge jams — these never show up at an intersection
  for (const [e, cnt] of jamEdgeNow) {
    if (cnt < JAM_NEED) continue;
    let j = jamEdgeAcc.get(e);
    if (!j) { j = { t: 0, cd: 0 }; jamEdgeAcc.set(e, j); }
    j.t += dt;
    if (j.t >= JAM_TIME && tSim > j.cd &&
        !edgeDeclogs.has(e) && cops.length < MAX_COPS)
      startEdgeDeclog(e, j);
  }
  for (const [e, j] of jamEdgeAcc)
    if (!jamEdgeNow.has(e)) j.t = Math.max(0, j.t - dt * 2);
  for (const [e, dg] of edgeDeclogs)
    if (tSim >= dg.until) edgeDeclogs.delete(e);
}

  {
    const p = (dayTime % DAY_CYCLE) / DAY_CYCLE;

    if (isDay) {

      sky = 0x0a0e1a; fogC = 0x0d1420;
    }
    if (raining) { sunI *= 0.5; ambI *= 0.55; sky = 0x6d8296; fogC = 0x7d92a6; }
    sun.intensity = sunI; ambLight.intensity = ambI;
    scene.background.set(sky); scene.fog.color.set(fogC);
    if (isDay && !wasDay) showDayReport();            // dawn -> the day has ended
    wasDay = isDay;
    if (++clockTick % 10 === 0) {
      const left = Math.max(0, Math.round(isDay ? DAY_LEN - p * DAY_CYCLE
                                                : DAY_CYCLE - p * DAY_CYCLE));
      const mm = String((left / 60) | 0).padStart(1, '0');
      const ss = String(left % 60).padStart(2, '0');
      clockEl.textContent = `${isDay ? 'Day' : 'Night'} ${mm}:${ss} left`;
      clockEl.style.borderColor = isDay ? '#ffb066' : '#6f8fd3';
    }
  }
  if (inspectMode) {
    // ground point under the cursor -> hover circle + houses inside it
    raycaster.setFromCamera(mouseV, camera);
    const gh = raycaster.ray.intersectPlane(groundPlane, inspectHit);
    if (gh) {
      inspectRing.position.set(gh.x, 0.12, gh.z);
      inspectRing.visible = true;
      if (++hoverTick % 8 === 0) {
        const near = [];
        for (const h of houses) {
          if (h.dead) continue;
          const dx = h.x - gh.x, dz = h.z - gh.z;
          if (dx * dx + dz * dz < INSPECT_R * INSPECT_R) near.push(h);
        }
        near.sort((a, b) =>
          ((a.x - gh.x) ** 2 + (a.z - gh.z) ** 2) -
          ((b.x - gh.x) ** 2 + (b.z - gh.z) ** 2));
        hovHouseList = near;
        // house directly under the cursor -> highlight it
        const targets = [];
        for (const h of houses) if (!h.dead) targets.push(h.grp);
        raycaster.setFromCamera(mouseV, camera);
        const hits = raycaster.intersectObjects(targets, true);
        let ch = null;
        for (const hit of hits) {
          let o = hit.object;
          while (o) {
            if (o.userData.house) { ch = o.userData.house; break; }
            o = o.parent;
          }
          if (ch) break;
        }
        cursorHouse = ch;
      }
      if (hovHouseList && hovHouseList.length) {
        hovTag.innerHTML = hovHouseList.slice(0, 8).map(h =>
          h.happiness === undefined
            ? 'House — no deliveries yet'
            : `House ★${h.happiness.toFixed(1)} · ${h.ratingsN} deliveries` +
              (h.timeN ? ` · avg ${fmtTime(h.timeSum / h.timeN)} · best ${fmtTime(h.timeMin)}` : '')
        ).join('<br>') +
          (hovHouseList.length > 8 ? `<br>…and ${hovHouseList.length - 8} more` : '');
        hovTag.style.display = 'block';
        hovTag.style.left = ((mouseV.x * 0.5 + 0.5) * innerWidth + 20) + 'px';
        hovTag.style.top = ((-mouseV.y * 0.5 + 0.5) * innerHeight - 12) + 'px';
      } else hovTag.style.display = 'none';
    } else {
      inspectRing.visible = false;
      hovTag.style.display = 'none';
      hovHouseList = null;
    }
  } else { hovTag.style.display = 'none'; inspectRing.visible = false; }
  // pinned house stats panel (click a house in inspect mode)
  if (inspectMode && inspHouse && !inspHouse.dead) {
    const h = inspHouse;
    inspPanel.textContent = h.happiness === undefined
      ? 'House — no deliveries yet'
      : `House ★${h.happiness.toFixed(1)} · ${h.ratingsN} deliveries` +
        (h.timeN ? ` · avg ${fmtTime(h.timeSum / h.timeN)} · best ${fmtTime(h.timeMin)}` : '');
    popVec.set(h.x, 10, h.z).project(camera);
    if (popVec.z > 1) inspPanel.style.display = 'none';
    else {
      inspPanel.style.display = 'block';
      inspPanel.style.left = ((popVec.x * 0.5 + 0.5) * innerWidth) + 'px';
      inspPanel.style.top = ((-popVec.y * 0.5 + 0.5) * innerHeight) + 'px';
    }
  } else inspPanel.style.display = 'none';
  if (!paused && !dayHold) {
    tSim += dt * simSpeed;
    updateCars(dt * simSpeed);
    gameTick(dt * simSpeed);
    updateSignals();
    if (toastUntil >= 0 && tSim > toastUntil) {
      toastEl.style.display = 'none';
      toastUntil = -1;
    }
  }
  if (camRider) {
    // camera chases the focused rider until the button is clicked again
    const k = Math.min(1, dt * 2.5);
    camTmp.set(camRider.px + 24, 26, camRider.pz + 24);
    camera.position.lerp(camTmp, k);
    camTmp.set(camRider.px, 0, camRider.pz);
    controls.target.lerp(camTmp, k);
  } else {
    const goal = topDown ? 1 : 0;
    camBlend += (goal - camBlend) * Math.min(1, dt * 3);
    // only drive the camera while a view transition is in progress —
    // otherwise OrbitControls owns the position (fixes zoom/orbit fighting)
    if (camBlend > 0.002) camera.position.lerpVectors(camPosA, camPosB, camBlend);
    else camBlend = goal;
  }

  // WASD camera pan (Q/E down/up, Shift = fast)
  const fwd = new THREE.Vector3();
  camera.getWorldDirection(fwd); fwd.y = 0;
  if (fwd.lengthSq() > 1e-6) {
    fwd.normalize();
    const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0, 1, 0));
    const spd = (keys.ShiftLeft || keys.ShiftRight ? 160 : 70) * dt;
    const mv = new THREE.Vector3();
    if (keys.KeyW) mv.add(fwd);
    if (keys.KeyS) mv.sub(fwd);
    if (keys.KeyD) mv.add(right);
    if (keys.KeyA) mv.sub(right);
    if (keys.KeyE) mv.y += 1;
    if (keys.KeyQ) mv.y -= 1;
    if (mv.lengthSq() > 0) {
      mv.normalize().multiplyScalar(spd);
      camera.position.add(mv);
      controls.target.add(mv);
    }
  }
  controls.update();

  if (++statTick % 15 === 0) {
    elCars.textContent = cars.length;
    let sum = 0; for (const c of cars) sum += c.speed;
    elSpeed.textContent = cars.length ? Math.round(sum / cars.length * 3.6) : 0;
    elTrips.textContent = trips;
    elCash.textContent = '$' + playerMoney;
    elBuy.classList.toggle('on', riderPanelOpen);
    if (riderPanelOpen && ++rpTick % 8 === 0) renderRiderPanel();
    elFood.textContent = FW.unlocked ? 'Food Hub: ON' : `Food Hub — Unlock $${FOOD_UNLOCK_COST}`;
    elFood.disabled = FW.unlocked || playerMoney < FOOD_UNLOCK_COST;
    elUber.textContent = UW.unlocked ? 'Uber Hub: ON' : `Uber Hub — Unlock $${UBER_UNLOCK_COST}`;
    elUber.disabled = UW.unlocked || playerMoney < UBER_UNLOCK_COST;
  }
  // "Received" popups fade after 3s
  for (let i = recvPops.length - 1; i >= 0; i--) {
    const rp = recvPops[i];
    const age = tSim - rp.born;
    if (age > 3) { rp.el.remove(); recvPops.splice(i, 1); continue; }
    popVec.set(rp.x, 7, rp.z).project(camera);
    if (popVec.z > 1) { rp.el.style.display = 'none'; continue; }
    rp.el.style.display = 'block';
    rp.el.style.left = ((popVec.x * 0.5 + 0.5) * innerWidth) + 'px';
    rp.el.style.top = ((-popVec.y * 0.5 + 0.5) * innerHeight) + 'px';
    rp.el.style.opacity = 1 - age / 3;
  }
  // floating texts rise and fade quickly
  for (let i = floatTexts.length - 1; i >= 0; i--) {
    const ft = floatTexts[i];
    const age = tSim - ft.born;
    if (age > 1.6) { ft.el.remove(); floatTexts.splice(i, 1); continue; }
    popVec.set(ft.x, 7 + age * 5, ft.z).project(camera);
    if (popVec.z > 1) { ft.el.style.display = 'none'; continue; }
    ft.el.style.display = 'block';
    ft.el.style.left = ((popVec.x * 0.5 + 0.5) * innerWidth) + 'px';
    ft.el.style.top = ((-popVec.y * 0.5 + 0.5) * innerHeight) + 'px';
    ft.el.style.opacity = 1 - age / 1.6;
  }
  // "Managing" tag tracks the police car working a jam
  {
    const cop = cars.find(c => c.role === 'police' && c.state === 'managing');
    if (cop) {
      popVec.set(cop.px, 6, cop.pz).project(camera);
      if (popVec.z > 1) manageTag.style.display = 'none';
      else {
        manageTag.style.display = 'block';
        manageTag.style.left = ((popVec.x * 0.5 + 0.5) * innerWidth) + 'px';
        manageTag.style.top = ((-popVec.y * 0.5 + 0.5) * innerHeight) + 'px';
        document.getElementById('mgBar').style.width =
          Math.max(0, cop.manage / DECLAG_TIME * 100) + '%';
      }
    } else manageTag.style.display = 'none';
  }
  // emergency sirens flash red <-> blue
  {
    const ph = (realT * 3.5) % 2 < 1;
    for (const s of sirens) {
      s.r.color.setHex(ph ? 0xff2222 : 0x3a0d0d);
      s.b.color.setHex(ph ? 0x0d1c3a : 0x2266ff);
    }
  }
  // order popups expire after 10s -> auto-decline
  const expired = [];
  for (const p of popups) if (tSim - p.born > 10) expired.push(p);
  for (const p of expired) {
    let ix = orders.indexOf(p.order);
    if (ix < 0) ix = foodOrders.indexOf(p.order);
    if (ix < 0) ix = uberOrders.indexOf(p.order);
    if (ix >= 0) (orders.includes(p.order) ? orders
      : foodOrders.includes(p.order) ? foodOrders : uberOrders).splice(ix, 1);
    closePopup(p);
    refreshOrderVisuals();
    floatPop(p.house.x, p.house.z, 'Order Declined', '#ff8a8a');
  }
  // track order popups to their houses in screen space
  for (const p of popups) {
    popVec.set(p.house.x, 5, p.house.z).project(camera);
    if (popVec.z > 1) { p.el.style.display = 'none'; continue; }
    p.el.style.display = 'block';
    p.el.style.left = ((popVec.x * 0.5 + 0.5) * innerWidth) + 'px';
    p.el.style.top = ((-popVec.y * 0.5 + 0.5) * innerHeight) + 'px';
    const t = p.el.querySelector('.t');
    if (t) {
      // time the house is willing to wait for the delivery (deadline countdown)
      const left = Math.max(0, Math.ceil(p.order.deadline - tSim));
      t.textContent = `${left}s`;
      t.style.color = left > (p.order.dur || ORDER_DEADLINE) * 0.4 ? '#9fd48a' : left > 10 ? '#ffd27a' : '#ff8080';
    }
  }
  // order timer bars float above their houses; vanish when depleted
  for (let i = orderTags.length - 1; i >= 0; i--) {
    const t = orderTags[i];
    const left = t.order.deadline - tSim;
    if (left <= 0 || (!orders.includes(t.order) && !foodOrders.includes(t.order) &&
        !uberOrders.includes(t.order))) {
      t.order.tagDone = true;
      t.el.remove();
      orderTags.splice(i, 1);
      continue;
    }
    popVec.set(t.house.x, 13, t.house.z).project(camera);
    if (popVec.z > 1) { t.el.style.display = 'none'; continue; }
    t.el.style.display = 'block';
    t.el.style.left = ((popVec.x * 0.5 + 0.5) * innerWidth) + 'px';
    t.el.style.top = ((-popVec.y * 0.5 + 0.5) * innerHeight) + 'px';
    const frac = Math.max(0, Math.min(1, left / (t.order.dur || ORDER_DEADLINE)));
    const bar = t.el.querySelector('i');
    bar.style.width = (frac * 100) + '%';
    bar.style.background = frac > 0.4 ? '#ff8c1a' : frac > 0.15 ? '#ffd27a' : '#ff5040';
  }
  // warehouses/hubs: hover highlights with a ring, click opens the info panel
  // (raycast throttled to every 4th frame — it doesn't need 60hz accuracy)
  if (++hovBldTick % 4 === 0) {
    const b = bldHitAt();
    if (b) {
      hovBld.kind = b.bld;
      if (b.bld === 'port') { hovBld.x = b.port.hub.x; hovBld.z = b.port.hub.z; }
      else {
        const m = { wh: WH, fw: FW, uw: UW, th: THUB, rh: RH };
        hovBld.x = m[b.bld].x; hovBld.z = m[b.bld].z;
      }
    } else hovBld.kind = null;
  }
  const whHover = hovBld.kind === 'wh', fwHover = hovBld.kind === 'fw',
        uwHover = hovBld.kind === 'uw';
  whHoverNow = !!(whHover || whClicked);
  fwHoverNow = !!(fwHover || fwClicked);
  if (inspectMode && cursorHouse) {
    bldRing.position.set(cursorHouse.x, 0.14, cursorHouse.z);
    bldRing.visible = true;
  } else if (hovBld.kind) {
    bldRing.position.set(hovBld.x, 0.14, hovBld.z); bldRing.visible = true;
  } else bldRing.visible = false;
  cvEl.style.cursor = hovBld.kind ? 'pointer' : '';
  popVec.set(WH.x, 11, WH.z).project(camera);
  if ((whClicked || WH.funds > 0) && popVec.z <= 1) {
    whPanel.style.display = 'block';
    whPanel.style.left = ((popVec.x * 0.5 + 0.5) * innerWidth) + 'px';
    whPanel.style.top = ((-popVec.y * 0.5 + 0.5) * innerHeight) + 'px';
  } else whPanel.style.display = 'none';
  updateWhPanel();
  // food warehouse panel: click, or auto-show claim when funds unclaimed
  popVec.set(FW.x, 10, FW.z).project(camera);
  if ((fwClicked || (FW.unlocked && FW.funds > 0)) && popVec.z <= 1) {
    fwPanel.style.display = 'block';
    fwPanel.style.left = ((popVec.x * 0.5 + 0.5) * innerWidth) + 'px';
    fwPanel.style.top = ((-popVec.y * 0.5 + 0.5) * innerHeight) + 'px';
  } else fwPanel.style.display = 'none';
  updateFwPanel();
  // uber hub panel: click to open, or auto-show when funds unclaimed
  popVec.set(UW.x, 10, UW.z).project(camera);
  if ((uwClicked || (UW.unlocked && UW.funds > 0)) && popVec.z <= 1) {
    uwPanel.style.display = 'block';
    uwPanel.style.left = ((popVec.x * 0.5 + 0.5) * innerWidth) + 'px';
    uwPanel.style.top = ((-popVec.y * 0.5 + 0.5) * innerHeight) + 'px';
  } else uwPanel.style.display = 'none';
  updateUwPanel();
  // port / truck hub / repair hub panels (opened by clicking the buildings)
  if (selPort) {
    popVec.set(selPort.hub.x, 10, selPort.hub.z).project(camera);
    if (popVec.z <= 1) {
      portPanel.style.display = 'block';
      portPanel.style.left = ((popVec.x * 0.5 + 0.5) * innerWidth) + 'px';
      portPanel.style.top = ((-popVec.y * 0.5 + 0.5) * innerHeight) + 'px';
      renderPortPanel();
    } else portPanel.style.display = 'none';
  } else portPanel.style.display = 'none';
  if (thOpen) {
    popVec.set(THUB.x, 13, THUB.z).project(camera);
    if (popVec.z <= 1) {
      thPanel.style.display = 'block';
      thPanel.style.left = ((popVec.x * 0.5 + 0.5) * innerWidth) + 'px';
      thPanel.style.top = ((-popVec.y * 0.5 + 0.5) * innerHeight) + 'px';
      renderThPanel();
    } else thPanel.style.display = 'none';
  } else thPanel.style.display = 'none';
  if (rhOpen) {
    popVec.set(RH.x, 13, RH.z).project(camera);
    if (popVec.z <= 1) {
      rhPanel.style.display = 'block';
      rhPanel.style.left = ((popVec.x * 0.5 + 0.5) * innerWidth) + 'px';
      rhPanel.style.top = ((-popVec.y * 0.5 + 0.5) * innerHeight) + 'px';
      renderRhPanel();
    } else rhPanel.style.display = 'none';
  } else rhPanel.style.display = 'none';
  // "!" markers float over active road closures (lane blocks + accidents)
  for (const ev of roadEvents) {
    if (ev.type === 'festival' || ev.stage !== 'active') continue;
    let tag = eventTags.get(ev);
    if (!tag) {
      tag = document.createElement('div');
      tag.className = 'pop';
      tag.style.cssText =
        'position:fixed;z-index:30;pointer-events:none;color:#ff5040;' +
        'font-weight:700;font-size:17px;border-color:#ff5040';
      tag.textContent = '!';
      document.body.appendChild(tag);
      eventTags.set(ev, tag);
    }
    popVec.set(ev.x, 7, ev.z).project(camera);
    if (popVec.z > 1) tag.style.display = 'none';
    else {
      tag.style.display = 'block';
      tag.style.left = ((popVec.x * 0.5 + 0.5) * innerWidth) + 'px';
      tag.style.top = ((-popVec.y * 0.5 + 0.5) * innerHeight) + 'px';
    }
  }
  for (const [ev, tag] of eventTags)
    if (!roadEvents.includes(ev) || ev.stage !== 'active') {
      tag.remove(); eventTags.delete(ev);
    }
  // pulse house order beacons + shimmer the light beams
  const pulse = 1 + 0.18 * Math.sin(tSim * 5);
  for (const k in beaconMats)
    beaconMats[k].beam.opacity = 0.16 + 0.12 * (0.5 + 0.5 * Math.sin(tSim * 5));
  for (const h of beaconTargets()) {
    if (!h.beacons) continue;
    for (const k in h.beacons) {
      const b = h.beacons[k];
      if (b.visible) b.scale.set(pulse, 1 + 0.1 * Math.sin(tSim * 5), pulse);
    }
  }
  // route lines for every active rider/truck
  for (const c of cars) {
    if (c.role !== 'rider' && c.role !== 'truck' && c.role !== 'repair') continue;
    const show = !!(c.path && !c.idle && c.s < c.path.total);
    let rec = vehLines.get(c);
    if (!show) { if (rec) rec.line.visible = false; continue; }
    const kind = c.food ? 'food' : c.uber ? 'uber' : 'parcel';
    if (!rec) {
      const line = new THREE.Line(new THREE.BufferGeometry(), VEH_LINE_MATS[kind]);
      line.frustumCulled = false; line.renderOrder = 998;
      scene.add(line);
      rec = { line, kind };
      vehLines.set(c, rec);
    }
    if (rec.kind !== kind) { rec.line.material = VEH_LINE_MATS[kind]; rec.kind = kind; }
    rec.line.visible = true;
    const pts = [];
    for (let d = c.s; d < c.path.total; d += 4) {
      const p = posAt(c.path, d);
      pts.push(p.x, 0.22, p.z);
    }
    const e2 = posAt(c.path, c.path.total);
    pts.push(e2.x, 0.22, e2.z);
    rec.line.geometry.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  }
  for (const [c, rec] of vehLines) {
    if (!cars.includes(c)) { scene.remove(rec.line); vehLines.delete(c); }
  }
  // clouds drift east, rain falls (real-time, unaffected by sim speed)
  for (const c of clouds) {
    c.position.x += c.userData.v * dt;
    if (c.position.x > 750) c.position.x = -750;
  }
  if (raining) {
    const p = rainGeo.attributes.position.array;
    for (let i = 0; i < RAIN_N; i++) {
      const j = i * 3;
      p[j + 1] -= 70 * dt;
      p[j] += 14 * dt; // wind slant
      if (p[j + 1] < 0) {
        p[j + 1] = RAIN_H;
        p[j] = (Math.random() - 0.5) * RAIN_BOX;
        p[j + 2] = (Math.random() - 0.5) * RAIN_BOX;
      }
    }
    rainGeo.attributes.position.needsUpdate = true;
  }

  renderer.render(scene, camera);
}
renderRiderPanel();
animate();
</script>
</body>
</html>
