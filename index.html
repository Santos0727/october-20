<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { clone as skClone } from 'three/addons/utils/SkeletonUtils.js';

/* ================= CITY LAYOUT ================= */
// Road graph: nodes have arbitrary x,z; edges connect them with per-edge
// width / lane offset / speed. Three road classes:
//   highway ring (fast, no signals)
//   arterials   (signalized grid intersections)
//   residential (small streets, no signals)
const ART = [-240, -120, 0, 120, 240];   // arterial lines
const ARTERIAL_W = 16, RES_W = 8, HWY_W = 22;
const HWY = 300;                          // highway ring half-size

const nodes = [];          // {x, z, signalized}
const nodeMap = new Map(); // "x,z" -> id
function addNode(x, z, signalized = false) {
  const key = x + ',' + z;
  if (nodeMap.has(key)) return nodeMap.get(key);
  const id = nodes.length;
  nodes.push({ x, z, signalized });
  nodeMap.set(key, id);
  return id;
}

// arterial intersections (signalized)
for (const x of ART) for (const z of ART) addNode(x, z, true);

// residential nodes inside each 120m cell: one mid-block intersection
// per cell, with short stubs connecting it to the bounding arterials
for (let ai = 0; ai < ART.length - 1; ai++) for (let aj = 0; aj < ART.length - 1; aj++) {
  const x0 = ART[ai], x1 = ART[ai + 1], z0 = ART[aj], z1 = ART[aj + 1];
  const mx = x0 + 60, mz = z0 + 60;
  addNode(mx, z0); addNode(mx, z1);   // stubs on the horizontal arterials
  addNode(x0, mz); addNode(x1, mz);   // stubs on the vertical arterials
  addNode(mx, mz);                    // interior intersection
}

// highway ring nodes
const ring = [
  [HWY, 0], [HWY, HWY], [0, HWY], [-HWY, HWY], [-HWY, 0],
  [-HWY, -HWY], [0, -HWY], [HWY, -HWY]
];
for (const [x, z] of ring) addNode(x, z, false);

/* ================= EDGES ================= */
const edges = [];          // directed edges
const edgeMap = new Map(); // "a_b" -> edge
const adj = [];            // node id -> [neighbor node ids]
const undirected = [];     // {a, b, w} for markings

function ensureAdj() { while (adj.length < nodes.length) adj.push([]); }
ensureAdj();

function addEdge(ax, az, bx, bz, w, fast = false) {
  const a = nodeMap.get(ax + ',' + az), b = nodeMap.get(bx + ',' + bz);
  if (a === undefined || b === undefined || a === b) return;
  const dx = bx - ax, dz = bz - az, len = Math.hypot(dx, dz);
  const d = { x: dx / len, z: dz / len };
  const r = { x: -d.z, z: d.x }; // right-hand side of travel
  const e = {
    a, b, d, r, len,
    roadW: w, laneOff: w / 4,
    axis: Math.abs(d.z) > Math.abs(d.x) ? 'NS' : 'EW',
    fast
  };
  edges.push(e);
  edgeMap.set(a * 1024 + b, e);
  adj[a].push(b);
}
function connect(ax, az, bx, bz, w, fast = false) {
  addEdge(ax, az, bx, bz, w, fast);
  addEdge(bx, bz, ax, az, w, fast);
  undirected.push({ a: nodeMap.get(ax + ',' + az), b: nodeMap.get(bx + ',' + bz), w });
}

// --- arterial + residential lines ---
// group node ids by x (vertical roads) and by z (horizontal roads)
const byX = new Map(), byZ = new Map();
nodes.forEach((n, id) => {
  if (Math.abs(n.x) >= HWY || Math.abs(n.z) >= HWY) return; // ring handled separately
  if (!byX.has(n.x)) byX.set(n.x, []);
  if (!byZ.has(n.z)) byZ.set(n.z, []);
  byX.get(n.x).push(id); byZ.get(n.z).push(id);
});
const artSet = new Set(ART);
for (const [x, ids] of byX) {
  ids.sort((p, q) => nodes[p].z - nodes[q].z);
  const w = artSet.has(x) ? ARTERIAL_W : RES_W;
  for (let k = 0; k < ids.length - 1; k++)
    connect(x, nodes[ids[k]].z, x, nodes[ids[k + 1]].z, w);
}
for (const [z, ids] of byZ) {
  ids.sort((p, q) => nodes[p].x - nodes[q].x);
  const w = artSet.has(z) ? ARTERIAL_W : RES_W;
  for (let k = 0; k < ids.length - 1; k++)
    connect(nodes[ids[k]].x, z, nodes[ids[k + 1]].x, z, w);
}

// --- highway ring + connectors to arterials ---
for (let k = 0; k < ring.length; k++) {
  const [x1, z1] = ring[k], [x2, z2] = ring[(k + 1) % ring.length];
  connect(x1, z1, x2, z2, HWY_W, true);
}
connect(0, HWY, 0, 240, ARTERIAL_W);
connect(0, -HWY, 0, -240, ARTERIAL_W);
connect(HWY, 0, 240, 0, ARTERIAL_W);
connect(-HWY, 0, -240, 0, ARTERIAL_W);

/* ---- curved streets + overpass ---- */
// Roads get shape: the highway ring bows outward into sweeping curves and
// residential streets get gentle alternating bends. Curved edges are drawn
// as ribbons and sampled into short legs so cars follow the bend.
const deckY = (ee, x, z) => {           // bridge deck height at a point
  if (!ee || !ee.bridge) return 0.06;
  const b = ee.bridge;
  const d = b.axis === 'x' ? Math.abs(x - b.c) : Math.abs(z - b.c);
  return 0.06 + b.h * Math.max(0, 1 - d / b.half);
};
for (const ud of undirected) {
  const A = nodes[ud.a], B = nodes[ud.b];
  if (ud.w === HWY_W) {
    // ring edge: control point pushed to the outside of the loop
    const mx = (A.x + B.x) / 2, mz = (A.z + B.z) / 2;
    const dx = B.x - A.x, dz = B.z - A.z, len = Math.hypot(dx, dz) || 1;
    const ux = dx / len, uz = dz / len;
    let px = mx - ux * (mx * ux + mz * uz), pz = mz - uz * (mx * ux + mz * uz);
    const pl = Math.hypot(px, pz) || 1; px /= pl; pz /= pl;
    if (px * mx + pz * mz < 0) { px = -px; pz = -pz; }
    ud.ctl = { x: mx + px * 45, z: mz + pz * 45 };
    ud.curve = true;
  } else if (ud.w === RES_W) {
    const h = (ud.a * 31 + ud.b * 17) | 0;
    if (h % 5 < 2) continue;   // ~60% of interior streets stay straight
    // keep the outer cells straight so curves can't reach the highway ring
    if (Math.max(Math.abs(A.x), Math.abs(A.z), Math.abs(B.x), Math.abs(B.z)) > 200) continue;
    const bend = (h % 2 ? 1 : -1) * (6 + ((h >>> 4) % 7));  // ±6..12
    const dx = B.x - A.x, dz = B.z - A.z, len = Math.hypot(dx, dz) || 1;
    const ctl = { x: (A.x + B.x) / 2 - dz / len * bend,
                  z: (A.z + B.z) / 2 + dx / len * bend };
    // don't let the bow swing across a neighbouring intersection
    let blocked = false;
    for (const n of nodes) {
      if (n === A || n === B) continue;
      if ((n.x - ctl.x) ** 2 + (n.z - ctl.z) ** 2 < 20 * 20) { blocked = true; break; }
    }
    if (blocked) continue;
    ud.ctl = ctl;
    ud.curve = true;
  }
}
// overpass: replace the two EW arterial segments either side of the central
// NS arterial with a single 120m bridge edge passing OVER node (0,0). There
// is no intermediate node on the deck, so traffic can never turn off
// mid-span and sink through it; the NS road simply passes underneath.
const BRIDGE = { h: 8, c: 0, half: 60, axis: 'x' };
{
  const A = nodeMap.get('-60,0'), M = nodeMap.get('0,0'), C = nodeMap.get('60,0');
  if (A !== undefined && M !== undefined && C !== undefined) {
    const drop = new Set([A * 1024 + M, M * 1024 + A, M * 1024 + C, C * 1024 + M]);
    for (let i = edges.length - 1; i >= 0; i--) {
      const e = edges[i];
      if (drop.has(e.a * 1024 + e.b)) {
        edgeMap.delete(e.a * 1024 + e.b);
        adj[e.a] = adj[e.a].filter(v => v !== e.b);
        edges.splice(i, 1);
      }
    }
    for (let i = undirected.length - 1; i >= 0; i--) {
      const u = undirected[i];
      if (drop.has(u.a * 1024 + u.b) || drop.has(u.b * 1024 + u.a))
        undirected.splice(i, 1);
    }
    const mk = (a, b) => {
      const dx = nodes[b].x - nodes[a].x, dz = nodes[b].z - nodes[a].z;
      const len = Math.hypot(dx, dz);
      const d = { x: dx / len, z: dz / len };
      const e = { a, b, d, r: { x: -d.z, z: d.x }, len,
                  roadW: ARTERIAL_W, laneOff: ARTERIAL_W / 4, axis: 'EW', fast: false };
      edges.push(e); edgeMap.set(a * 1024 + b, e); adj[a].push(b);
    };
    mk(A, C); mk(C, A);
    undirected.push({ a: A, b: C, w: ARTERIAL_W, bridge: BRIDGE });
    // node (0,0) is now just a point on the NS road passing under the deck —
    // no at-grade crossing, so drop its signal/crosswalk treatment
    nodes[M].signalized = false;
  }
}
// propagate curve/bridge flags onto the directed edges used by buildLegs
for (const ud of undirected) {
  if (!ud.curve && !ud.bridge) continue;
  for (const [x, y] of [[ud.a, ud.b], [ud.b, ud.a]]) {
    const e = edgeMap.get(x * 1024 + y);
    if (!e) continue;
    if (ud.curve) { e.ctl = ud.ctl; e.curve = true; }
    if (ud.bridge) e.bridge = ud.bridge;
  }
}

const N = nodes.length;
console.log(`city: ${N} nodes, ${edges.length} directed edges`);

/* ================= TRAFFIC SIGNALS ================= */
// Only arterial intersections are signalized; offset creates green waves.
function sigOff(id) {
  const n = nodes[id];
  return (((n.x / 40) + (n.z / 40)) * 1.7) % 20;
}
const CYCLE = 20, NS_GREEN = 7, YELLOW = 1.5, ALL_RED = 0.5;
const EW_START = NS_GREEN + YELLOW + ALL_RED;
const EW_GREEN_END = EW_START + NS_GREEN;
const YEL2_END = EW_GREEN_END + YELLOW;

function signalAt(id, t) {
  if (!nodes[id].signalized) return { NS: 'g', EW: 'g' };
  const tt = (((t + sigOff(id)) % CYCLE) + CYCLE) % CYCLE;
  const ns = tt < NS_GREEN ? 'g' : tt < NS_GREEN + YELLOW ? 'y' : tt < EW_START ? 'r' : 'r';
  const ew = tt < EW_START ? 'r' : tt < EW_GREEN_END ? 'g' : tt < YEL2_END ? 'y' : 'r';
  return { NS: ns, EW: ew };
}

/* ================= SCENE ================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fbfe0);
scene.fog = new THREE.Fog(0x9cc3e0, 500, 1100);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 2500);
camera.position.set(160, 170, 260);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
const raycaster = new THREE.Raycaster();
const mouseV = new THREE.Vector2(-2, -2);
addEventListener('mousemove', e => {
  mouseV.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
});

// permanent route lines for riders & trucks
const vehLines = new Map();
const vehLineMat = new THREE.LineBasicMaterial({
  color: 0xffa040, transparent: true, opacity: 0.5, depthTest: false
});
const VEH_LINE_MATS = {
  parcel: vehLineMat,
  food: new THREE.LineBasicMaterial({
    color: 0x4aa8ff, transparent: true, opacity: 0.5, depthTest: false
  }),
  uber: new THREE.LineBasicMaterial({
    color: 0x3ddc84, transparent: true, opacity: 0.5, depthTest: false
  }),
};
controls.maxPolarAngle = Math.PI / 2 - 0.05;
controls.minDistance = 30;
controls.maxDistance = 900;
controls.target.set(0, 0, 0);

const ambLight = new THREE.AmbientLight(0xaac4e0, 0.7);
scene.add(ambLight);
scene.add(new THREE.HemisphereLight(0xbdd8f0, 0x4a5a48, 0.55));
const sun = new THREE.DirectionalLight(0xfff2dd, 1.6);
sun.position.set(200, 260, 100);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -450; sun.shadow.camera.right = 450;
sun.shadow.camera.top = 450; sun.shadow.camera.bottom = -450;
sun.shadow.camera.far = 1200;
scene.add(sun);

function mulberry(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry(12345);

const DIRS = [{ x: 1, z: 0 }, { x: -1, z: 0 }, { x: 0, z: 1 }, { x: 0, z: -1 }];

/* ================= KENNEY GLB MODELS ================= */
// Vehicles and people are Kenney GLBs under models/<kit>/. Each model is
// normalized at load: origin moved to bottom-center, natural size kept so
// spawn helpers can scale to a target dimension ('x'|'y'|'z'|'foot'|'max').
const gltfLoader = new GLTFLoader();
const modelLib = new Map();   // name -> {proto, size, clips}
const modelJobs = [];
const mixers = [];            // animated characters

function regModel(name, file) {
  modelJobs.push(new Promise(res => {
    gltfLoader.load('models/' + file, gltf => {
      const inner = skClone(gltf.scene);
      const box = new THREE.Box3().setFromObject(inner);
      const size = box.getSize(new THREE.Vector3());
      // wrap so the bottom-center offset scales together with the model
      const proto = new THREE.Group();
      inner.position.set(
        -(box.min.x + box.max.x) / 2,
        -box.min.y,
        -(box.min.z + box.max.z) / 2);
      proto.add(inner);
      proto.traverse(o => {
        if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }
      });
      modelLib.set(name, { proto, size, clips: gltf.animations || [] });
      res();
    }, undefined, () => res());
  }));
}

function mspawn(name, o = {}) {
  const M = modelLib.get(name);
  const g = new THREE.Group();
  if (!M) return g;
  const inner = skClone(M.proto);
  let s = o.scale ?? 1;
  if (o.target) {
    const nat = o.dim === 'y' ? M.size.y
      : o.dim === 'z' ? M.size.z
      : o.dim === 'foot' ? Math.max(M.size.x, M.size.z)
      : Math.max(M.size.x, M.size.y, M.size.z);
    s = o.target / nat;
  }
  inner.scale.setScalar(s);
  g.add(inner);
  g.position.set(o.x || 0, o.y || 0, o.z || 0);
  g.rotation.y = o.ry || 0;
  return g;
}

const CHAR_KEYS = ['male-a', 'male-b', 'male-c', 'male-d',

function spawnChar(anim = 'walk', scale = 1.9) {
  const M = modelLib.get('char:' + CHAR_KEYS[(rng() * CHAR_KEYS.length) | 0]);
  if (!M) return new THREE.Group();
  const g = skClone(M.proto);
  g.scale.setScalar(scale);
  g.traverse(o => { if (o.isMesh) { o.castShadow = true; } });
  const mixer = new THREE.AnimationMixer(g);
  const clip = M.clips.find(c => c.name === anim) || M.clips[0];
  if (clip) mixer.clipAction(clip).play();
  mixers.push(mixer);
  return g;
}

// distance from point to a road centerline (for house/tree placement)
function roadClearance(px, pz, margin) {
  for (const e of undirected) {
    const ax = nodes[e.a].x, az = nodes[e.a].z;
    const bx = nodes[e.b].x, bz = nodes[e.b].z;
    const need = e.w / 2 + margin;
    if (e.ctl) {
      // curved road: min distance to the sampled bezier centerline
      let dmin = Infinity, qx0 = ax, qz0 = az;
      for (let i = 1; i <= 6; i++) {
        const t = i / 6, u = 1 - t;
        const qx = u * u * ax + 2 * u * t * e.ctl.x + t * t * bx;
        const qz = u * u * az + 2 * u * t * e.ctl.z + t * t * bz;
        const sx = qx - qx0, sz = qz - qz0;
        const sl2 = sx * sx + sz * sz;
        let t2 = sl2 ? ((px - qx0) * sx + (pz - qz0) * sz) / sl2 : 0;
        t2 = Math.max(0, Math.min(1, t2));
        const dx = px - (qx0 + sx * t2), dz = pz - (qz0 + sz * t2);
        dmin = Math.min(dmin, dx * dx + dz * dz);
        qx0 = qx; qz0 = qz;
      }
      if (dmin < need * need) return false;
      continue;
    }
    const abx = bx - ax, abz = bz - az;
    const len2 = abx * abx + abz * abz;
    let t = len2 ? ((px - ax) * abx + (pz - az) * abz) / len2 : 0;
    t = Math.max(0, Math.min(1, t));
    const cx = ax + abx * t, cz = az + abz * t;
    const dx = px - cx, dz = pz - cz;
    if (dx * dx + dz * dz < need * need) return false;
  }
  return true;
}

    const cv = document.createElement('canvas');

  const poleMat = new THREE.MeshLambertMaterial({ color: 0x77808c });

  // candidate spots: mid-block on arterial edges, alternating sides
  const cands = [];
  for (const e of edges) {
    if (e.fast || e.roadW !== ARTERIAL_W) continue;
    const na = nodes[e.a], nb = nodes[e.b];
    const mx = (na.x + nb.x) / 2, mz = (na.z + nb.z) / 2;
    cands.push({ e, mx, mz });
  }
  cands.sort((p, q) => q.e.len - p.e.len);
  const chosen = [];
  for (const c of cands) {
    if (chosen.length >= 9) break;
    if (chosen.some(o => (o.mx - c.mx) ** 2 + (o.mz - c.mz) ** 2 < 150 * 150)) continue;
    chosen.push(c);
  }

  chosen.forEach((c, i) => {
    const b = BRANDS[i % BRANDS.length];
    const side = i % 2 ? 1 : -1;
    const off = c.e.roadW / 2 + 11; // building depth/2 + verge + sign clearance
    const px = c.mx + c.e.r.x * off * side;
    const pz = c.mz + c.e.r.z * off * side;

    for (const h of houses) {
      if ((h.x - px) ** 2 + (h.z - pz) ** 2 < 13 * 13) return;
    }

    // face the road: local +Z points back toward the street
    const fx = -c.e.r.x * side, fz = -c.e.r.z * side;

    const bb = mspawn('com:e', { target: BW, dim: 'x' });
    bb.position.y = 0.15; bb.castShadow = true; g.add(bb);

    const fascia = new THREE.Mesh(new THREE.PlaneGeometry(BW - 1, 1.7),
      new THREE.MeshBasicMaterial({ map: signTex[i % BRANDS.length] }));
    fascia.position.set(0, BH + 0.6, BD / 2 + 0.02); g.add(fascia);
    // tall pylon sign out front for roadside visibility
    const py = new THREE.Group();
    py.position.set(BW / 2 - 1.5, 0, BD / 2 + 2.2);
    const postH = BH + 3.5;
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.22, postH, 6), poleMat);
    post.position.y = postH / 2; post.castShadow = true; py.add(post);

      new THREE.MeshLambertMaterial({ color: 0x2c333d }));

    face.position.set(0, postH + 0.5, 0.17); py.add(face);
    g.add(py);
    scene.add(g);

    // snap to nearest road node for future delivery routing
    let best = 0, bd = Infinity;
    for (let n = 0; n < N; n++) {

  // candidate spots at true block centers — midpoints between consecutive
  // street lines, so every candidate starts maximally far from the road
  const lineXs = [...new Set(nodes
    .filter(n => Math.abs(n.x) < HWY && Math.abs(n.z) < HWY)
    .map(n => n.x))].sort((a, b) => a - b);
  const lineZs = [...new Set(nodes
    .filter(n => Math.abs(n.x) < HWY && Math.abs(n.z) < HWY)
    .map(n => n.z))].sort((a, b) => a - b);
  const centers = (lines) => {
    const out = [];
    for (let i = 0; i < lines.length - 1; i++) {
      const gap = lines[i + 1] - lines[i];
      if (gap >= 30) out.push((lines[i] + lines[i + 1]) / 2);
    }
    return out;
  };
  const cxs = centers(lineXs), czs = centers(lineZs);
  const spots = [];
  for (const bx of cxs) for (const bz of czs) {
    const px = bx + (rng() - 0.5) * 10, pz = bz + (rng() - 0.5) * 10;
    if (!roadClearance(px, pz, 9)) continue;
    if (restaurants.some(r => (r.x - px) ** 2 + (r.z - pz) ** 2 < 22 * 22)) continue;
    spots.push({ x: px, z: pz });
  }
  // per-type space needs: [roadMargin, evictionRadius] — buildings claim
  // their spot and remove any houses inside the eviction radius
  const NEED = {
    shop: [7, 10], park: [12, 15], pond: [10, 13],
    school: [12, 18], municipal: [12, 15], police: [9, 12], semitall: [12, 19]
  };
  const EVICT = { shop: 10, park: 15, pond: 13, school: 18, municipal: 15, police: 12, semitall: 19 };
  const quota = ['school', 'municipal', 'police', 'semitall', 'semitall', 'semitall',
    'park', 'park', 'park', 'park', 'pond', 'pond', 'pond', 'pond',
    ...Array(14).fill('shop')];
  for (let i = quota.length - 1; i > 0; i--) {
    const j = (rng() * (i + 1)) | 0; [quota[i], quota[j]] = [quota[j], quota[i]];
  }
  const fits = (s, kind) => {
    const [rm] = NEED[kind];
    return roadClearance(s.x, s.z, rm);
  };
  const evict = (s, kind) => {
    const r = EVICT[kind];
    for (const h of houses) {
      if (h.dead) continue;
      if ((h.x - s.x) ** 2 + (h.z - s.z) ** 2 < r * r) {
        if (h.grp) scene.remove(h.grp);
        h.dead = true;
      }
    }
  };
  let qi = 0;
  for (const s of spots) {
    if (!quota.length) break;
    // find a remaining quota kind that fits this spot
    let pick = -1;
    for (let k = qi; k < quota.length; k++) {
      if (fits(s, quota[k])) { pick = k; break; }
    }
    if (pick < 0) continue;
    const kind = quota.splice(pick, 1)[0];
    qi = pick; // splice shifts; continue scanning from same index next spot
    const ry = rng() * Math.PI * 2;
    if (kind === 'pond') builders.pond(s.x, s.z, false);
    else builders[kind](s.x, s.z, ry);
    evict(s, kind);
    civic.push({ x: s.x, z: s.z, type: kind });
  }
  // leftover spots become shops where the road allows
  for (const s of spots) {
    if (civic.filter(c => c.type === 'shop').length >= 20) break;
    if (civic.some(c => (c.x - s.x) ** 2 + (c.z - s.z) ** 2 < 20 * 20)) continue;
    if (!fits(s, 'shop')) continue;
    builders.shop(s.x, s.z, rng() * Math.PI * 2);
    evict(s, 'shop');
    civic.push({ x: s.x, z: s.z, type: 'shop' });
  }
  // no lakes beyond the ring anymore — the ocean surrounds the city
  // snap civic buildings to nearest node for future routing
  for (const c of civic) {
    let best = 0, bd = Infinity;
    for (let n = 0; n < N; n++) {
      const d = (nodes[n].x - c.x) ** 2 + (nodes[n].z - c.z) ** 2;
      if (d < bd) { bd = d; best = n; }
    }
    c.node = best;
  }
  console.log(`civic: ${civic.length} buildings`);
}

  raycaster.setFromCamera(mouseV, camera);
  const hits = raycaster.intersectObjects(bldGroups, true);
  for (const hit of hits) {

// Lane markings: dashed center line per undirected edge
{
  const lineGeo = new THREE.BoxGeometry(0.18, 0.02, 2.2);
  const lineMat = new THREE.MeshBasicMaterial({ color: 0xd8d8d8 });
  let count = 0;
  for (const ed of undirected) {
    if (ed.curve || ed.bridge) continue;
    const ax = nodes[ed.a].x, az = nodes[ed.a].z;
    const bx = nodes[ed.b].x, bz = nodes[ed.b].z;
    count += Math.floor(Math.hypot(bx - ax, bz - az) / 4);
  }
  const lines = new THREE.InstancedMesh(lineGeo, lineMat, count);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(1, 1, 1);
  const eul = new THREE.Euler();
  let idx = 0;
  for (const ed of undirected) {
    if (ed.curve || ed.bridge) continue;
    const ax = nodes[ed.a].x, az = nodes[ed.a].z;
    const bx = nodes[ed.b].x, bz = nodes[ed.b].z;
    const dx = bx - ax, dz = bz - az, len = Math.hypot(dx, dz);
    const ux = dx / len, uz = dz / len;
    const yaw = Math.atan2(ux, uz);
    for (let s = -len / 2 + 3; s < len / 2 - 2; s += 4) {
      eul.set(0, yaw, 0); q.setFromEuler(eul);
      m.compose(new THREE.Vector3(ax + ux * (len / 2 + s), 0.055, az + uz * (len / 2 + s)), q, sc);
      if (idx < count) lines.setMatrixAt(idx++, m);
    }
  }
  lines.count = idx;
  scene.add(lines);
}

// ---- Road surfaces, sidewalks, edge lines, median, crosswalks ----
{
  const byClass = { 16: [], 8: [], 22: [] };
  for (const ed of undirected) {
    if (ed.curve || ed.bridge) continue;   // drawn as ribbons instead
    (byClass[ed.w] || byClass[16]).push(ed);
  }

  const mk = (geo, mat, list, build) => {
    if (!list.length) return;
    const im = new THREE.InstancedMesh(geo, mat, list.length);
    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), eul = new THREE.Euler();
    list.forEach((it, i) => { eul.set(0, it.yaw, 0); q.setFromEuler(eul); m.compose(it.p, q, it.s); im.setMatrixAt(i, m); });
    im.instanceMatrix.needsUpdate = true;
    im.computeBoundingSphere();
    scene.add(im);
  };
  const mid = ed => {
    const ax = nodes[ed.a].x, az = nodes[ed.a].z;
    const bx = nodes[ed.b].x, bz = nodes[ed.b].z;
    return {
      x: (ax + bx) / 2, z: (az + bz) / 2,
      dx: bx - ax, dz: bz - az, len: Math.hypot(bx - ax, bz - az),
      yaw: Math.atan2(bx - ax, bz - az)
    };
  };

  // one asphalt color for every road class so highway<->street transitions
  // don't show as alternating stripes
  const surfMat = { 16: new THREE.MeshLambertMaterial({ color: 0x3a3f47 }),
                    8:  new THREE.MeshLambertMaterial({ color: 0x3a3f47 }),
                    22: new THREE.MeshLambertMaterial({ color: 0x3a3f47 }) };
  for (const w of [16, 8, 22]) {
    mk(new THREE.BoxGeometry(1, 0.06, 1), surfMat[w], byClass[w].map(ed => {
      const m = mid(ed);
      return { p: new THREE.Vector3(m.x, 0.02, m.z), yaw: m.yaw, s: new THREE.Vector3(w, 1, m.len) };
    }));
  }

  // sidewalks flanking every road
  const swItems = [];
  for (const w of [16, 8, 22]) for (const ed of byClass[w]) {
    const m = mid(ed);
    const rx = -m.dz / m.len, rz = m.dx / m.len; // right vector
    for (const side of [-1, 1]) {
      swItems.push({
        p: new THREE.Vector3(m.x + rx * side * (w / 2 + 1.0), 0.07, m.z + rz * side * (w / 2 + 1.0)),
        yaw: m.yaw, s: new THREE.Vector3(1.8, 1, m.len)
      });
    }
  }
  mk(new THREE.BoxGeometry(1, 0.12, 1), new THREE.MeshLambertMaterial({ color: 0x9aa0a0 }), swItems);

  // solid edge lines on arterials + highway
  const elItems = [];
  for (const w of [16, 22]) for (const ed of byClass[w]) {
    const m = mid(ed);
    const rx = -m.dz / m.len, rz = m.dx / m.len;
    for (const side of [-1, 1]) {
      elItems.push({
        p: new THREE.Vector3(m.x + rx * side * (w / 2 - 0.55), 0.06, m.z + rz * side * (w / 2 - 0.55)),
        yaw: m.yaw, s: new THREE.Vector3(0.15, 1, m.len - 4)
      });
    }
  }
  mk(new THREE.BoxGeometry(1, 0.02, 1), new THREE.MeshBasicMaterial({ color: 0xe8e8e2 }), elItems);

  // highway median strip
  const medItems = byClass[22].map(ed => {
    const m = mid(ed);
    return { p: new THREE.Vector3(m.x, 0.06, m.z), yaw: m.yaw, s: new THREE.Vector3(0.6, 1, m.len) };
  });
  mk(new THREE.BoxGeometry(1, 0.1, 1), new THREE.MeshLambertMaterial({ color: 0xcfcdbd }), medItems);

  // crosswalk zebra stripes at every signalized approach
  const cwItems = [];
  for (let id = 0; id < N; id++) {
    if (!nodes[id].signalized) continue;
    const nx = nodes[id].x, nz = nodes[id].z;
    for (const d of DIRS) {
      const rx = -d.z, rz = d.x;
      const bx = nx - d.x * (ARTERIAL_W / 2 + 2.6);
      const bz = nz - d.z * (ARTERIAL_W / 2 + 2.6);
      const yaw = Math.atan2(d.x, d.z);
      for (let k = 0; k < 6; k++) {
        const lat = (k - 2.5) * 2.4;
        cwItems.push({
          p: new THREE.Vector3(bx + rx * lat, 0.065, bz + rz * lat),
          yaw, s: new THREE.Vector3(1, 1, 1)
        });
      }
    }
  }
  mk(new THREE.BoxGeometry(0.55, 0.025, 2.6), new THREE.MeshBasicMaterial({ color: 0xf2f2ea }), cwItems);
}

/* ---- curved road ribbons + bridge deck ---- */
{
  const rp = [], ri = [];
  const nv = () => rp.length / 3;
  // triangle strip along center points {x,y,z}, half-width w
  function strip(pts, w) {
    const base = nv();
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      const q = pts[Math.min(i + 1, pts.length - 1)];
      const r = pts[Math.max(i - 1, 0)];
      let tx = q.x - r.x, tz = q.z - r.z;
      const tl = Math.hypot(tx, tz) || 1; tx /= tl; tz /= tl;
      const rx = -tz, rz = tx;
      rp.push(p.x + rx * w, p.y, p.z + rz * w);
      rp.push(p.x - rx * w, p.y, p.z - rz * w);
    }
    for (let i = 0; i < pts.length - 1; i++) {
      const a = base + i * 2;
      ri.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
    }
  }
  const roadMat = new THREE.MeshLambertMaterial({
    color: 0x3a3f47, side: THREE.DoubleSide
  });

  // curved streets: ribbon following the same bezier the cars drive
  for (const ed of undirected) {
    if (!ed.curve) continue;
    const A = nodes[ed.a], B = nodes[ed.b];
    const N = 28, pts = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N, u = 1 - t;
      pts.push({
        x: u * u * A.x + 2 * u * t * ed.ctl.x + t * t * B.x,
        z: u * u * A.z + 2 * u * t * ed.ctl.z + t * t * B.z,
        y: 0.055
      });
    }
    strip(pts, ed.w / 2);
  }

  // bridge deck + rails + pillars
  const railPts = [];
  for (const ed of undirected) {
    if (!ed.bridge) continue;
    const A = nodes[ed.a], B = nodes[ed.b];
    const N = 24, pts = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const x = A.x + (B.x - A.x) * t, z = A.z + (B.z - A.z) * t;
      pts.push({ x, z, y: 0.05 + (deckY({ bridge: ed.bridge }, x, z) - 0.06) });
    }
    strip(pts, 9);   // deck, slightly wider than the road
    // guard rails: low walls along both edges
    for (const side of [-1, 1]) {
      const rp2 = [];
      for (let i = 0; i <= N; i++) {
        const p = pts[i];
        const q = pts[Math.min(i + 1, N)], r = pts[Math.max(i - 1, 0)];
        let tx = q.x - r.x, tz = q.z - r.z;
        const tl = Math.hypot(tx, tz) || 1; tx /= tl; tz /= tl;
        const rx = -tz * side * 8.6, rz = tx * side * 8.6;
        rp2.push({ x: p.x + rx, z: p.z + rz, y: p.y });
      }
      railPts.push(rp2);
    }
  }
  if (rp.length) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(rp, 3));
    g.setIndex(ri);
    g.computeVertexNormals();
    scene.add(new THREE.Mesh(g, roadMat));
  }
  // rails as thin vertical ribbons
  {
    const wp = [], wi = [];
    for (const pts of railPts) {
      const base = wp.length / 3;
      for (let i = 0; i < pts.length; i++) {
        const p = pts[i];
        wp.push(p.x, p.y, p.z, p.x, p.y + 0.9, p.z);
      }
      for (let i = 0; i < pts.length - 1; i++) {
        const a = base + i * 2;
        wi.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
      }
    }
    if (wp.length) {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(wp, 3));
      g.setIndex(wi);
      scene.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({
        color: 0xb8bec8, side: THREE.DoubleSide
      })));
    }
  }
}

      const px = nx - d.x * off + r.x * off;
      const pz = nz - d.z * off + r.z * off;
      const grp = new THREE.Group();
      const pole = new THREE.Mesh(poleGeo, poleMat);
      pole.position.y = 1.6; grp.add(pole);
      const head = new THREE.Mesh(sigGeo, sigMats.r);
      head.position.y = 3.3; grp.add(head);
      grp.position.set(px, 0, pz);
      grp.lookAt(nx, 0, nz);
      scene.add(grp);
      sigHeads.push({ mesh: head, node: id, axis: d.z !== 0 ? 'NS' : 'EW' });
    }
  }
}

function bfsPath(from, to, banNext = -1) {
  if (from === to) return null;
  const prev = new Int32Array(N).fill(-1);
  const q = [from]; prev[from] = from;
  while (q.length) {
    const cur = q.shift();
    if (cur === to) break;
    for (const nb of adj[cur]) {
      if (prev[nb] !== -1) continue;
      if (cur === from && nb === banNext) continue;   // avoid instant U-turn
      const e = edgeMap.get(ekey(cur, nb));
      if (e && e.noRoute && tSim < e.until) continue;   // closed by a road event
      prev[nb] = cur; q.push(nb);
    }
  }
  if (prev[to] === -1) return null;
  const path = []; for (let c = to; c !== from; c = prev[c]) path.unshift(c);
  return [from, ...path];
}

const ekey = (a, b) => a * 1024 + b;

// Build a drivable path (legs) for a node route.
// startOverride: world {x,z} the car is actually at — first leg starts there
// so the path continues smoothly instead of snapping to the lane offset.
function buildLegs(nodeRoute, startOverride = null) {
  const legs = [];
  const edgeList = [];
  for (let k = 0; k < nodeRoute.length - 1; k++) {
    const e = edgeMap.get(ekey(nodeRoute[k], nodeRoute[k + 1]));
    if (!e) return null;
    edgeList.push(e);
  }
  // disallow U-turns: no edge may reverse the previous edge's direction
  for (let k = 1; k < edgeList.length; k++) {
    const p = edgeList[k - 1], c = edgeList[k];
    if (p.d.x === -c.d.x && p.d.z === -c.d.z) return null;
  }
  const V = (x, z) => new THREE.Vector3(x, 0.06, z);
  let pendingStart = null;   // arc merge point for the next edge leg
  for (let k = 0; k < edgeList.length; k++) {
    const e = edgeList[k];
    const na = nodes[e.a], nb = nodes[e.b];
    const ax = na.x + e.r.x * e.laneOff, az = na.z + e.r.z * e.laneOff;
    const bx = nb.x + e.r.x * e.laneOff, bz = nb.z + e.r.z * e.laneOff;
    let start = pendingStart ||
      (k === 0 && startOverride ? new THREE.Vector3(startOverride.x, 0.06, startOverride.z)
                               : V(ax, az));
    pendingStart = null;
    if (e.bridge) start = new THREE.Vector3(start.x, deckY(e, start.x, start.z), start.z);
    const legBase = legs.length;
    if (e.ctl) {
      // curved street: sample the lane-offset bezier into short legs
      const N = Math.max(4, Math.min(30, Math.round(e.len / 9)));
      const offx = e.r.x * e.laneOff, offz = e.r.z * e.laneOff;
      const cx = e.ctl.x + offx, cz = e.ctl.z + offz;
      let prev = start;
      for (let i = 1; i <= N; i++) {
        const t = i / N, u = 1 - t;
        const qx = u * u * ax + 2 * u * t * cx + t * t * bx;
        const qz = u * u * az + 2 * u * t * cz + t * t * bz;
        const p = i === N ? V(bx, bz) : V(qx, qz);
        legs.push({ a: prev, b: p, edge: e, eidx: k });
        prev = p;
      }
    } else if (e.bridge) {
      // bridge deck: straight lane line following the elevation profile
      const N = Math.max(8, Math.round(e.len / 4));
      let prev = start;
      for (let i = 1; i <= N; i++) {
        const t = i / N;
        const qx = ax + (bx - ax) * t, qz = az + (bz - az) * t;
        const py = deckY(e, qx, qz);
        const p = new THREE.Vector3(qx, py, qz);
        legs.push({ a: prev, b: p, edge: e, eidx: k });
        prev = p;
      }
    } else {
      legs.push({ a: start, b: V(bx, bz), edge: e, eidx: k });
    }
    if (k < edgeList.length - 1) {
      const ne = edgeList[k + 1];
      const nn = nodes[ne.a];
      const sx = nn.x + ne.r.x * ne.laneOff, sz = nn.z + ne.r.z * ne.laneOff;
      const turnA = new THREE.Vector3(bx, deckY(e, bx, bz), bz);
      const turnB = new THREE.Vector3(sx, deckY(ne, sx, sz), sz);
      // Right turns (cross > 0) can't use the diagonal corner cut: lane
      // offsets make the cut point backwards vs the exit, so the car has
      // to spin ~270° of yaw. Arc around the inside corner instead —
      // tangent to both lanes, starting before the node and merging into
      // the outgoing lane past it.
      const cross = e.d.x * ne.d.z - e.d.z * ne.d.x;
      let arced = false;
      if (cross > 1e-6) {
        const R = Math.max(4, Math.min(e.roadW, ne.roadW) / 2 - 1);
        // offset both lane lines right by R; their intersection = arc center
        const pax = bx + e.r.x * R, paz = bz + e.r.z * R;
        const pbx = sx + ne.r.x * R, pbz = sz + ne.r.z * R;
        const rhx = pbx - pax, rhz = pbz - paz;
        const det = ne.d.x * e.d.z - e.d.x * ne.d.z;
        if (Math.abs(det) > 1e-6) {
          const t1 = (-rhx * ne.d.z + ne.d.x * rhz) / det;
          const t2 = (e.d.x * rhz - rhx * e.d.z) / det;
          const ox = pax + t1 * e.d.x, oz = paz + t1 * e.d.z;
          // tangent points = projections of O onto each lane line
          const s1 = (ox - bx) * e.d.x + (oz - bz) * e.d.z;
          const T1x = bx + s1 * e.d.x, T1z = bz + s1 * e.d.z;
          const s2 = (ox - sx) * ne.d.x + (oz - sz) * ne.d.z;
          const T2x = sx + s2 * ne.d.x, T2z = sz + s2 * ne.d.z;
          const curLen = legs[legBase].a.distanceTo(legs[legs.length - 1].b);
          if (s1 < -2 && curLen + s1 > 4 && s2 > 0 && s2 < ne.len - 6) {
            const v1x = T1x - ox, v1z = T1z - oz;
            const v2x = T2x - ox, v2z = T2z - oz;
            const ang = Math.atan2(v1x * v2z - v1z * v2x, v1x * v2x + v1z * v2z);
            if (ang > 0) {   // clockwise/right-hand sweep only
              // multi-leg edges (curves/bridge) must be trimmed back to the
              // tangent point T1 first; bail to the corner cut if not enough
              // sampled length remains
              let trimOk = true;
              if (legs.length - 1 > legBase) {
                let need = -s1, drop = 0, part = null;
                for (let i = legs.length - 1; i > legBase; i--) {
                  const ll = legs[i].a.distanceTo(legs[i].b);
                  if (ll <= need) { need -= ll; drop++; }
                  else { part = { i, u: 1 - need / ll }; need = 0; break; }
                }
                if (need > 1e-6) trimOk = false;
                else {
                  legs.length -= drop;
                  if (part) {
                    const l = legs[part.i];
                    l.b = l.a.clone().lerp(l.b, part.u);
                  }
                }
              }
              if (trimOk) {
              const NSEG = 6;
              const end1 = new THREE.Vector3(T1x, deckY(e, T1x, T1z), T1z);
              const end2 = new THREE.Vector3(T2x, deckY(ne, T2x, T2z), T2z);
              legs[legs.length - 1].b = end1;
              let prev = end1;
              for (let i = 1; i <= NSEG; i++) {
                const th = ang * i / NSEG;
                const cs = Math.cos(th), sn = Math.sin(th);
                const px = ox + v1x * cs - v1z * sn;
                const pz = oz + v1x * sn + v1z * cs;
                const yy = end1.y + (end2.y - end1.y) * (i / NSEG);
                const p = i === NSEG ? end2 : new THREE.Vector3(px, yy, pz);
                legs.push({ a: prev, b: p, edge: null, eidx: k });
                prev = p;
              }
                pendingStart = end2.clone();
                arced = true;
              }
            }
          }
        }
      }
      if (!arced && turnA.distanceTo(turnB) > 0.3) {
        legs.push({ a: turnA, b: turnB, edge: null, eidx: k }); // corner cut across intersection
      }
    }
  }
  // cumulative distances + corner speed zones
  const cum = [0]; let total = 0;
  for (const l of legs) { total += l.a.distanceTo(l.b); cum.push(total); }
  const slows = [];
  for (let k = 1; k < legs.length; k++) {
    const d1 = legs[k - 1].b.clone().sub(legs[k - 1].a);
    const d2 = legs[k].b.clone().sub(legs[k].a);
    if (d1.lengthSq() < 1e-6 || d2.lengthSq() < 1e-6) continue;
    d1.normalize(); d2.normalize();
    const ang = Math.acos(THREE.MathUtils.clamp(d1.dot(d2), -1, 1));
    if (ang > 0.25) slows.push({ d: cum[k], v: THREE.MathUtils.clamp(10.5 - ang * 130, 3, 10.5) });
  }
  return { legs, cum, total, slows, edgeList };
}

function edgeDirs(ud) {
  return [edgeMap.get(ud.a * 1024 + ud.b), edgeMap.get(ud.b * 1024 + ud.a)]
    .filter(Boolean);
}
// sample points along a directed edge's lane line (bezier-aware)
function lanePoints(e, step) {
  const A = nodes[e.a], B = nodes[e.b];
  const ax = A.x + e.r.x * e.laneOff, az = A.z + e.r.z * e.laneOff;
  const bx = B.x + e.r.x * e.laneOff, bz = B.z + e.r.z * e.laneOff;
  const pts = [];
  if (e.ctl) {
    const cx = e.ctl.x + e.r.x * e.laneOff, cz = e.ctl.z + e.r.z * e.laneOff;
    const N = Math.max(4, Math.round(e.len / step));
    for (let i = 0; i <= N; i++) {
      const t = i / N, u = 1 - t;
      pts.push({ x: u * u * ax + 2 * u * t * cx + t * t * bx,
                 z: u * u * az + 2 * u * t * cz + t * t * bz });
    }
  } else {
    const N = Math.max(1, Math.round(e.len / step));
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      pts.push({ x: ax + (bx - ax) * t, z: az + (bz - az) * t });
    }
  }
  return pts;
}
const coneGeo = new THREE.ConeGeometry(0.4, 1.0, 8);
const coneMat = new THREE.MeshLambertMaterial({ color: 0xff7a1a });
function addCones(ev, pts) {
  for (let i = 0; i < pts.length; i += 2) {   // every other sample ~14m
    const p = pts[i];
    const cone = new THREE.Mesh(coneGeo, coneMat);
    cone.position.set(p.x, 0.5, p.z);
    cone.castShadow = true;
    scene.add(cone);
    ev.meshes.push(cone);
  }
}
// translucent red strip laid over the closed lane so the closure reads at a glance
function addClosedStrip(ev, e, width) {
  const pts = lanePoints(e, 4);
  if (pts.length < 2) return;
  const hx = e.r.x * width / 2, hz = e.r.z * width / 2;
  const pos = [];
  for (const p of pts) pos.push(p.x - hx, 0.07, p.z - hz, p.x + hx, 0.07, p.z + hz);
  const idx = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const a = i * 2;
    idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({
    color: 0xff5040, transparent: true, opacity: 0.3,
    depthWrite: false, side: THREE.DoubleSide }));
  scene.add(m);
  ev.meshes.push(m);
}
function closeEdge(e, mul, dur) {
  e.noRoute = true; e.until = tSim + dur; e.eventMul = mul;
}
function eligibleEdges() {
  return undirected.filter(u => !u.bridge && (u.w === 8 || u.w === 16));
}
function spawnLaneBlock() {
  const cands = eligibleEdges();
  if (!cands.length) return;
  const ud = cands[(rng() * cands.length) | 0];
  const dirs = edgeDirs(ud);
  const e = dirs[(rng() * dirs.length) | 0];
  const dur = 70 + rng() * 70;
  const A = nodes[e.a], B = nodes[e.b];
  const pts = lanePoints(e, e.len / 2);   // ~3 samples -> true midpoint
  const mid = pts[pts.length >> 1];
  // staged event: firetruck drives out first, road closes when it parks
  const ev = { type: 'lane', stage: 'incoming', until: Infinity,
               edges: [e], pending: [e], mul: 0.35, dur, truck: null,
               meshes: [], parkX: mid.x, parkZ: mid.z,
               x: (A.x + B.x) / 2, z: (A.z + B.z) / 2,
               setup: () => {
                 addCones(ev, lanePoints(e, 7));
                 addClosedStrip(ev, e, e.roadW * 0.5);
               } };
  if (!dispatchFireTruck(ev)) activateEvent(ev);   // fallback: close now
  roadEvents.push(ev);
}
function spawnAccident() {
  const cands = eligibleEdges();
  if (!cands.length) return;
  const ud = cands[(rng() * cands.length) | 0];
  const dirs = edgeDirs(ud);
  const dur = 60 + rng() * 50;
  const A = nodes[ud.a], B = nodes[ud.b];
  const pts = lanePoints(dirs[0], dirs[0].len / 2);   // ~3 samples -> midpoint
  const mid = pts[pts.length >> 1];
  const ev = { type: 'accident', stage: 'incoming', until: Infinity,
               edges: dirs, pending: dirs.slice(), mul: 0.15, dur, truck: null,
               meshes: [], parkX: mid.x, parkZ: mid.z,
               x: (A.x + B.x) / 2, z: (A.z + B.z) / 2,
               setup: () => {
                 for (const e of dirs) {
                   addCones(ev, lanePoints(e, 6));
                   addClosedStrip(ev, e, e.roadW * 0.5);
                 }
                 // wrecked vehicle at the midpoint
                 const wreck = new THREE.Group();
                 const body = new THREE.Mesh(new THREE.BoxGeometry(4, 1.4, 2),
                   new THREE.MeshLambertMaterial({ color: 0x552222 }));
                 body.position.y = 0.9; body.rotation.y = rng() * 0.6 - 0.3;
                 body.castShadow = true; wreck.add(body);
                 const cab = new THREE.Mesh(new THREE.BoxGeometry(2, 1.1, 1.8),
                   new THREE.MeshLambertMaterial({ color: 0x333a44 }));
                 cab.position.set(-0.3, 2, 0); cab.rotation.y = body.rotation.y;
                 wreck.add(cab);
                 wreck.position.set(ev.x, 0, ev.z);
                 wreck.rotation.y = Math.atan2(B.x - A.x, B.z - A.z);
                 scene.add(wreck);
                 ev.meshes.push(wreck);
               } };
  if (!dispatchFireTruck(ev)) activateEvent(ev);
  roadEvents.push(ev);
}
// firetruck leaves the police station, drives to the event edge and parks
// on the road; the closure only activates once it arrives
function dispatchFireTruck(ev) {
  const st = policeStationNode();
  const e0 = ev.edges[0];
  const sx = nodes[st].x, sz = nodes[st].z;
  const da = Math.hypot(nodes[e0.a].x - sx, nodes[e0.a].z - sz);
  const db = Math.hypot(nodes[e0.b].x - sx, nodes[e0.b].z - sz);
  const route = bfsPath(st, da <= db ? e0.a : e0.b);
  if (!route) return false;
  const p = buildLegs(route);
  if (!p) return false;
  appendLeg(p, ev.parkX, ev.parkZ);      // pull onto the closed lane
  const grp = new THREE.Group();
  grp.add(mspawn('car:firetruck', { target: 6.5, dim: 'z' }));
  addGlowRing(grp, 3.4);
  addSiren(grp, 3.0);
  scene.add(grp);
  const a = p.legs[0].a;
  const fd = p.legs[0].b.clone().sub(a);
  const c = {
    grp, path: p, s: 0, li: 0, speed: 0, vmax: 11, vlen: 5,
    edge: null, px: a.x, pz: a.z, dx: fd.x, dz: fd.z,
    yaw: Math.atan2(fd.x, fd.z), stuck: 0, yieldLatch: false,
    role: 'fire', state: 'toScene', manage: 0, home: st, ev, rep: 3
  };
  cars.push(c);
  addInspectDot(c);
  ev.truck = c;
  return true;
}
function activateEvent(ev) {
  for (const e of ev.pending) closeEdge(e, ev.mul, ev.dur);
  ev.pending = [];
  ev.stage = 'active';
  ev.until = tSim + ev.dur;
  if (ev.setup) { ev.setup(); ev.setup = null; }
  toast(ev.type === 'lane'
    ? 'Roadworks — lane closed ahead'
    : 'Accident reported — road closed',
    ev.type === 'lane' ? '#ffb066' : '#ff6b6b');
}
function fireArrive(c) {
  const ev = c.ev;

    c.state = 'parked';
    c.path = null;                        // sits on the closed road
    c.speed = 0;
    if (ev && ev.stage === 'incoming') activateEvent(ev);
    return;
  }
  c.state = 'done'; c.dead = true;       // home again -> retire
  if (ev) ev.truckDone = true;
}
function spawnFestival() {
  const cand = nodes[(rng() * N) | 0];
  if (Math.abs(cand.x) > HWY - 40 || Math.abs(cand.z) > HWY - 40) return;
  const until = tSim + 110 + rng() * 40;
  const ev = { type: 'festival', until, edges: [], meshes: [], npcs: [],
               x: cand.x, z: cand.z, r: 45 };
  for (let i = 0; i < 10; i++) {
    const p = makePerson();
    const a = rng() * Math.PI * 2, rr = 6 + rng() * 32;
    p.position.set(cand.x + Math.cos(a) * rr, 0, cand.z + Math.sin(a) * rr);
    scene.add(p);
    ev.npcs.push({ g: p, tx: p.position.x, tz: p.position.z, wait: rng() * 2 });
  }
  roadEvents.push(ev);
  toast('Street festival — expect delays', '#8fd3ff');
}
function spawnRoadEvent() {
  const roll = rng();
  if (roll < 0.45) spawnLaneBlock();
  else if (roll < 0.72) spawnAccident();
  else spawnFestival();
}
// reopen a closed road event early (natural expiry or repair-truck finish):
// lifts the closures, clears the cones/wreck, sends the firetruck home
function reopenEvent(ev) {
  ev.stage = 'leaving';
  for (const e of ev.edges) { e.noRoute = false; e.until = 0; e.eventMul = 1; }
  for (const m of ev.meshes) scene.remove(m);
  for (const n of ev.npcs || []) scene.remove(n.g);
  ev.meshes = []; ev.npcs = [];
  const tr = ev.truck;
  if (tr && !tr.dead && tr.state === 'parked') {
    const p = routeFrom(tr, policeStationNode());
    tr.state = 'returning';
    if (p) {
      tr.path = p; tr.s = 0; tr.li = 0; tr.speed = 0; tr.edge = null;
      tr.stuck = 0; tr.yieldLatch = false;
    } else tr.dead = true;
  }
}
// per-frame (sim dt) event upkeep: staged closures, expiry cleanup, festival crowds
function updateEvents(dt) {
  for (let i = roadEvents.length - 1; i >= 0; i--) {
    const ev = roadEvents[i];
    if (ev.type !== 'festival') {
      // incoming (truck enroute) -> active (closed) -> leaving (truck goes home)
      if (ev.stage === 'active' && tSim >= ev.until) {
        reopenEvent(ev);
      }
      if (ev.stage === 'leaving' && (!ev.truck || ev.truck.dead))
        roadEvents.splice(i, 1);
      continue;
    }
    if (tSim >= ev.until) {
      for (const m of ev.meshes) scene.remove(m);
      for (const n of ev.npcs || []) scene.remove(n.g);
      roadEvents.splice(i, 1);
      continue;
    }
    if (ev.type === 'festival') {
      for (const n of ev.npcs) {
        n.wait -= dt;
        const dx = n.tx - n.g.position.x, dz = n.tz - n.g.position.z;
        const d = Math.hypot(dx, dz);
        if (d < 0.5) {
          if (n.wait <= 0) {
            const a = rng() * Math.PI * 2, rr = 4 + rng() * (ev.r - 8);
            n.tx = ev.x + Math.cos(a) * rr; n.tz = ev.z + Math.sin(a) * rr;
            n.wait = 1 + rng() * 3;
          }
        } else {
          const v = 1.4 * dt, m = Math.min(v, d);
          n.g.position.x += dx / d * m; n.g.position.z += dz / d * m;
          n.g.rotation.y = Math.atan2(dx, dz);
        }
      }
    }
  }
}
// is a house inside/near an active event? -> rider may deliver on foot
function eventNearHouse(h, rad) {
  for (const ev of roadEvents)
    if (ev.until > tSim && (ev.type === 'festival' || ev.stage === 'active') &&
        (ev.x - h.x) ** 2 + (ev.z - h.z) ** 2 < rad * rad) return true;
  return false;
}
// should this rider park and walk the last stretch to the house?
function shouldWalk(c, stop) {
  const dx = stop.house.x - c.px, dz = stop.house.z - c.pz;
  if (dx * dx + dz * dz > 70 * 70) return false;
  if (eventNearHouse(stop.house, 55)) return true;
  if (c.path) for (let i = c.li; i < c.path.legs.length; i++) {
    const e = c.path.legs[i].edge;
    if (e && e.noRoute && tSim < e.until) return true;
  }
  return rng() < 0.15;
}
function startFootDelivery(c, stop) {
  const person = makePerson();
  person.position.set(c.px, 0, c.pz);
  scene.add(person);
  c.foot = { stop, person };
  c.path = null;
  c.legT0 = tSim;
}
function updateFoot(c, dt) {
  const f = c.foot, hp = f.stop.house;
  const dx = hp.x - f.person.position.x, dz = hp.z - f.person.position.z;
  const d = Math.hypot(dx, dz);
  if (d > 0.4) {
    const m = Math.min(3 * dt, d);
    f.person.position.x += dx / d * m;
    f.person.position.z += dz / d * m;
    f.person.rotation.y = Math.atan2(dx, dz);
    return;
  }
  c.delivery = { stop: f.stop, person: f.person, t: 0, paid: false, static: true };
  c.dwell = 5;
  c.dwellNext = (c.stopIdx + 1) < c.stops.length;
  c.foot = null;
}

const cars = [];
let trips = 0;

function randomNode() { return (rng() * N) | 0; }

function spawnCar() {
  for (let tries = 0; tries < 12; tries++) {
    const id = randomNode();
    let dest = randomNode();
    if (dest === id) dest = randomNode();
    const route = bfsPath(id, dest);
    if (!route) continue;
    const path = buildLegs(route);
    if (!path) continue;
    // clearance check near spawn point
    const p0 = path.legs[0].a;
    let clear = true;
    for (const c of cars) {
      const dx = c.px - p0.x, dz = c.pz - p0.z;
      if (dx * dx + dz * dz < 15 * 15) { clear = false; break; }
    }
    if (!clear) continue;

    // vehicle mix: ~58% cars, 17% taxis, 13% buses, 12% bicycles
    const vr = rng();
    const vtype = vr < 0.58 ? 'car' : vr < 0.75 ? 'taxi' : vr < 0.88 ? 'bus' : 'bike';
    const vmaxBase = vtype === 'bus' ? 7.5 + rng() * 2.5
      : vtype === 'bike' ? 9.5 + rng() * 3.5
      : vtype === 'taxi' ? 9 + rng() * 3 : 8 + rng() * 4.5;
    const { grp, vlen } = buildTrafficMesh(vtype, (rng() * carPalette.length) | 0);
    scene.add(grp);

    const firstDir = path.legs[0].b.clone().sub(path.legs[0].a);
    cars.push({
      grp, path,
      s: 0, li: 0, speed: 0,
      vmax: vmaxBase, vlen,
      edge: null, edgeDist: 0,
      px: p0.x, pz: p0.z,
      dx: firstDir.x, dz: firstDir.z,
      yaw: Math.atan2(firstDir.x, firstDir.z),
      stuck: 0,
      pri: rng(),
      dest
    });
    addInspectDot(cars[cars.length - 1]);
    return true;
  }
  return false;
}

// World position at a given distance along a path
function posAt(path, dist) {
  dist = THREE.MathUtils.clamp(dist, 0, path.total);
  let i = 0;
  while (i < path.legs.length - 1 && dist > path.cum[i + 1]) i++;
  const l = path.legs[i];
  const ul = Math.max(1e-5, path.cum[i + 1] - path.cum[i]);
  const u = THREE.MathUtils.clamp((dist - path.cum[i]) / ul, 0, 1);
  return { x: l.a.x + (l.b.x - l.a.x) * u, z: l.a.z + (l.b.z - l.a.z) * u };
}

// Is the lane ~13m past the upcoming node clear enough to enter the box?
// coarse spatial hash over cars — keeps the per-frame neighbor checks
// (car-following, intersection yield, exit-clear) near O(1) instead of O(n²)
const CAR_CELL = 16;
let carGridMap = null;
function nearCars(x, z, r, fn) {
  const x0 = Math.floor((x - r) / CAR_CELL), x1 = Math.floor((x + r) / CAR_CELL);
  const z0 = Math.floor((z - r) / CAR_CELL), z1 = Math.floor((z + r) / CAR_CELL);
  for (let gx = x0; gx <= x1; gx++) for (let gz = z0; gz <= z1; gz++) {
    const b = carGridMap && carGridMap.get(gx + ',' + gz);
    if (b) for (const c of b) if (fn(c)) return true;
  }
  return false;
}

function exitClear(c) {
  const target = c.s + (c.path.cum[c.li + 1] - c.s) + 13;
  if (target >= c.path.total) return true;
  const p = posAt(c.path, target);
  return !nearCars(p.x, p.z, 8, o => {
    if (o === c) return false;
    if (Math.abs(o.grp.position.y - c.grp.position.y) > 1.2) return false; // different level
    const dx = o.px - p.x, dz = o.pz - p.z;
    return dx * dx + dz * dz < 6 * 6;
  });
}

function carPos(c) {
  const l = c.path.legs[c.li];
  const u = THREE.MathUtils.clamp((c.s - c.path.cum[c.li]) / Math.max(1e-5, c.path.cum[c.li + 1] - c.path.cum[c.li]), 0, 1);
  return l.a.clone().lerp(l.b, u);
}

function arrive(c) {
  if (c.role === 'truck') { truckArrive(c); return; }
  if (c.role === 'rider') { riderArrive(c); return; }
  if (c.role === 'police') { policeArrive(c); return; }
  if (c.role === 'fire') { fireArrive(c); return; }
  if (c.role === 'hubtruck') { hubTruckArrive(c); return; }
  if (c.role === 'repair') { repairArrive(c); return; }
  trips++;
  const lastNode = c.path.edgeList[c.path.edgeList.length - 1].b;
  const prevNode = c.path.edgeList.length > 0
    ? c.path.edgeList[c.path.edgeList.length - 1].a : lastNode;
  const sx = c.px, sz = c.pz;

  let built = null;
  for (let t = 0; t < 10 && !built; t++) {
    const dest = randomNode();
    const route = bfsPath(lastNode, dest);
    if (!route) continue;
    if (route[1] === prevNode) continue;  // no immediate U-turn back
    built = buildLegs(route, { x: sx, z: sz });
  }
  if (!built) {
    const nb = adj[lastNode].find(n => n !== prevNode) ?? adj[lastNode][0];
    built = buildLegs([lastNode, nb], { x: sx, z: sz });
  }
  c.path = built;
  c.s = 0; c.li = 0; c.speed = 0; c.edge = null; c.stuck = 0; c.yieldLatch = false;
}

// ---- police declog ----
function policeStationNode() {
  const st = civic.find(c => c.type === 'police');
  return st && st.node !== undefined ? st.node : WH.node;
}
function spawnPolice(nid, tx, tz) {
  const from = policeStationNode();
  const route = bfsPath(from, nid);
  if (!route) return;
  const p = buildLegs(route);
  if (!p) return;
  if (tx !== undefined) appendLeg(p, tx, tz);   // mid-block jam: stop at the site
  const grp = new THREE.Group();
  grp.add(mspawn('car:police', { target: 4.6, dim: 'z' }));
  addGlowRing(grp, 3);
  addSiren(grp, 2.3);
  scene.add(grp);
  const a = p.legs[0].a;
  const fd = p.legs[0].b.clone().sub(a);
  cars.push({
    grp, path: p, s: 0, li: 0, speed: 0, vmax: 14, vlen: 4.5,
    edge: null, px: a.x, pz: a.z, dx: fd.x, dz: fd.z,
    yaw: Math.atan2(fd.x, fd.z), stuck: 0, yieldLatch: false,
    role: 'police', state: 'toJam', manage: 0, home: from,
    rep: 3
  });
  addInspectDot(cars[cars.length - 1]);
}
function policeArrive(c) {
  if (c.state === 'toJam') {
    c.state = 'managing';
    c.manage = DECLAG_TIME;      // sim-seconds on scene, matches declogs window
    c.path = null;
    c.speed = 0;
    return;
  }
  c.state = 'done'; c.dead = true;   // home again -> retire
}
function startDeclog(nid, j) {
  j.t = 0; j.cd = tSim + 120;                    // cooldown before re-dispatch
  declogs.set(nid, { until: tSim + DECLAG_TIME });
  spawnPolice(nid);
  toast('Traffic jam — police dispatched', '#7fb2ff');
}
// mid-block jam: police drive to the edge midpoint, not just an intersection
function startEdgeDeclog(e, j) {
  j.t = 0; j.cd = tSim + 120;
  edgeDeclogs.set(e, { until: tSim + DECLAG_TIME });
  // route to whichever endpoint is closer to the station, then onto the site
  const st = policeStationNode();
  const da = (nodes[e.a].x - nodes[st].x) ** 2 + (nodes[e.a].z - nodes[st].z) ** 2;
  const db = (nodes[e.b].x - nodes[st].x) ** 2 + (nodes[e.b].z - nodes[st].z) ** 2;
  spawnPolice(da <= db ? e.a : e.b,
    (nodes[e.a].x + nodes[e.b].x) / 2, (nodes[e.a].z + nodes[e.b].z) / 2);
  toast('Traffic jam — police dispatched', '#7fb2ff');
}

/* ================= GAME: ORDERS / SUPPLY TRUCK / RIDER ================= */
const orders = [];
const popups = [];
const recvPops = [];
// floating world-anchored text that rises and fades away ("+ $",
// "Order Accepted!", ...) — plain text, no box
const floatTexts = [];
function floatPop(x, z, text, color = '#6fd3ff') {
  const el = document.createElement('div');
  el.style.cssText =
    'position:fixed;z-index:70;pointer-events:none;white-space:nowrap;' +
    'font-size:16px;font-weight:700;color:' + color +
    ';text-shadow:0 1px 5px rgba(0,0,0,.85);transform:translate(-50%,-50%)';
  el.textContent = text;
  document.body.appendChild(el);
  floatTexts.push({ x, z, el, born: tSim });
}
const PARCEL_PAY = 12;
let playerMoney = 0;
let orderSeq = 0;
const ringNodes = nodes.map((n, i) =>
  (Math.abs(n.x) === HWY || Math.abs(n.z) === HWY) ? i : -1).filter(i => i >= 0);
let orderTimer = 0;

function outstanding() {
  let s = 0;
  for (const o of orders) if (o.stage !== 'pending') s += o.parcels - o.delivered;
  return s;
}
function warehouseStock() {
  let s = 0;
  for (const o of orders) if (o.stage === 'atWarehouse')
    s += o.parcels - o.delivered - (o.reserved || 0);
  return s;
}

const ORDER_DEADLINE = 180;   // sim-seconds a customer waits for full pay
                               // (longer now: orders come by ship -> hub -> truck)
const MAX_TRUCKS = 3;
const LATE_PAY = 0.4;         // fraction of PARCEL_PAY if delivered late

// order rarity: bigger parcels, bigger pay, tighter deadline, distinct color.
// pay gaps between tiers are deliberately large.
const RARITY = [
  { name: 'Common',    w: 50, pm: 1.0, pay: 1.0, tm: 1.15, color: '#cfe2f5' },
  { name: 'Uncommon',  w: 28, pm: 1.5, pay: 1.7, tm: 1.05, color: '#7fe08a' },
  { name: 'Rare',      w: 14, pm: 2.3, pay: 3.2, tm: 0.95, color: '#5fb2ff' },
  { name: 'Epic',      w: 6,  pm: 3.4, pay: 6.0, tm: 0.85, color: '#c58bff' },
  { name: 'Legendary', w: 2,  pm: 4.6, pay: 10.0, tm: 0.75, color: '#ffb340' },
];
function rollRarity() {
  let r = rng() * 100, acc = 0;
  for (const q of RARITY) { acc += q.w; if (r < acc) return q; }
  return RARITY[0];
}

// houses keep ordering until the 20-parcel cap is reached.
// New orders pop up and must be accepted before the truck is dispatched.
function tryCreateOrder() {
  const out = outstanding();
  if (out >= warehouseCap() || popups.length >= 4) return;
  const rar = rollRarity();
  const size = Math.min(Math.round((3 + ((rng() * 6) | 0)) * rar.pm), warehouseCap() - out);
  if (size < 1) return;
  // pick a random alive house (civic buildings evict overlapping houses)
  let h = null;
  for (let t = 0; t < 20; t++) {
    const cand = houses[(rng() * houses.length) | 0];
    if (!cand.dead) { h = cand; break; }
  }
  if (!h) return;
  const window = ORDER_DEADLINE * rar.tm;
  // urgency premium: less waiting time relative to parcel count -> higher pay
  const urgency = Math.min(1.5, 1 + (size / window) * 10);
  const order = {
    house: h, parcels: size, delivered: 0,
    stage: autoAccept ? 'waitShip' : 'pending', id: ++orderSeq,
    port: (rng() * PORTS.length) | 0,   // random port receives this order
    deadline: tSim + window, dur: window,
    payMul: rar.pay * urgency, rarity: rar
  };
  orders.push(order);
  if (autoAccept) refreshOrderVisuals();
  else showOrderPopup(order);
  refreshOrderVisuals();
}

function showOrderPopup(order) {
  const el = document.createElement('div');
  el.className = 'pop';
  el.style.borderColor = order.rarity.color;
  el.innerHTML = `<b style="color:${order.rarity.color}">${order.rarity.name}</b>` +
    ` — ${order.parcels} parcels · $${Math.round(order.parcels * PARCEL_PAY * order.payMul)}` +
    ` · house waits <span class="t"></span><br><button class="ok">Accept</button><button class="no">Decline</button>`;
  document.body.appendChild(el);
  const rec = { order, el, house: order.house, born: tSim };
  popups.push(rec);
  el.querySelector('.ok').onclick = () => {
    order.stage = 'waitShip';
    closePopup(rec);
    refreshOrderVisuals();
    floatPop(order.house.x, order.house.z, 'Order Accepted!', '#7fe08a');
  };
  el.querySelector('.no').onclick = () => {
    const ix = orders.indexOf(order);
    if (ix >= 0) orders.splice(ix, 1);
    closePopup(rec);
    refreshOrderVisuals();
    floatPop(order.house.x, order.house.z, 'Order Declined', '#ff8a8a');
  };
}
function closePopup(rec) {
  const i = popups.indexOf(rec);
  if (i >= 0) popups.splice(i, 1);
  rec.el.remove();
}

function parcelStats() {

const beaconMats = {};   // kind -> { core, beam, spr }
const glowTexs = {};
function beaconMatSet(kind) {
  if (!beaconMats[kind]) {

      grad.addColorStop(0, `rgba(${r},${gg},${b},1)`);
      grad.addColorStop(0.4, `rgba(${r},${gg},${b},0.55)`);
      grad.addColorStop(1, `rgba(${r},${gg},${b},0)`);
      g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
      const t = new THREE.CanvasTexture(cv);
      t.colorSpace = THREE.SRGBColorSpace;
      glowTexs[kind] = t;
    }
    beaconMats[kind] = {
      core: new THREE.MeshBasicMaterial({ color: c.core }),
      beam: new THREE.MeshBasicMaterial({
        color: c.beam, transparent: true, opacity: 0.22,
        blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
      }),

        map: glowTexs[kind], color: c.core, transparent: true, opacity: 0.9,
        blending: THREE.AdditiveBlending, depthWrite: false
      }),

  return beaconMats[kind];
}
function houseBeacon(h, kind) {

// pull-in point for a building: on the line from its center toward the road
// node, close enough to look like a driveway but clear of the walls
function dockPoint(t) {
  if (t.dockX === undefined) {
    const dx = nodes[t.node].x - t.x, dz = nodes[t.node].z - t.z;
    const d = Math.hypot(dx, dz) || 1;
    t.dockX = t.x + dx / d * 14;
    t.dockZ = t.z + dz / d * 14;
  }
  return { x: t.dockX, z: t.dockZ };
}

// append a driveway leg so a vehicle drives right up to a point (house/warehouse door)
function appendLeg(path, tx, tz) {
  const last = path.legs[path.legs.length - 1];
  path.legs.push({ a: last.b.clone(), b: new THREE.Vector3(tx, 0.06, tz), edge: null, eidx: last.eidx });
  path.cum = [0];
  let t = 0;
  for (const l of path.legs) { t += l.a.distanceTo(l.b); path.cum.push(t); }
  path.total = t;
}

function nearestNode(x, z) {
  let bi = 0, bd = Infinity;
  for (let i = 0; i < N; i++) {
    const dx = nodes[i].x - x, dz = nodes[i].z - z, d = dx * dx + dz * dz;
    if (d < bd) { bd = d; bi = i; }
  }
  return bi;
}

// route a vehicle from wherever it is to a node. Prefers a route that doesn't
// instantly reverse, but allows the U-turn when it's the only way out (dead
// ends) — the old retry loop just fell back to one edge + a straight line.
function routeFrom(c, dest) {
  const el = c.path && c.path.edgeList;
  const last = el && el.length ? el[el.length - 1].b : nearestNode(c.px, c.pz);
  const prev = el && el.length ? el[el.length - 1].a : -1;
  const routes = [];
  if (prev >= 0) { const r = bfsPath(last, dest, prev); if (r) routes.push(r); }
  const r2 = bfsPath(last, dest);
  if (r2 && r2 !== routes[0]) routes.push(r2);
  for (const route of routes) {
    const p = buildLegs(route, { x: c.px, z: c.pz });
    if (p) return p;
  }
  return null;
}

// reroute a vehicle at the upcoming node when its road (or the next one)
// is closed by a road event; eidx = index of the edge ending at that node
function divertCar(c, eidx) {
  const el = c.path.edgeList;
  const nodeId = el[eidx].b, prevN = el[eidx].a, dest = el[el.length - 1].b;
  if (nodeId === dest) return false;                 // closure ends at destination
  const routes = [];
  const r1 = bfsPath(nodeId, dest, prevN); if (r1) routes.push(r1);
  const r2 = bfsPath(nodeId, dest);       if (r2) routes.push(r2);
  for (const route of routes) {
    const p = buildLegs(route, { x: c.px, z: c.pz });
    if (p) {
      c.path = p; c.s = 0; c.li = 0; c.edge = null;
      c.stuck = 0; c.yieldLatch = false; c.waitT = 0;
      return true;
    }
  }
  return false;
}

function truckArrive(c) {
  if (c.exiting) { c.dead = true; return; }
  for (const o of c.cargo) { o.stage = 'atWarehouse'; o.truck = null; }
  c.cargo = null;
  const p = routeFrom(c, c.thNode);
  if (!p) { c.dead = true; return; }
  appendLeg(p, THUB.x, THUB.z + 20);   // pull back into the truck hub yard, then retire
  c.path = p; c.s = 0; c.li = 0; c.speed = 0; c.edge = null;
  c.stuck = 0; c.yieldLatch = false; c.exiting = true;
}

    state: 'sail', tx: port.berth.x, tz: port.berth.z, timer: 0
  };
  grp.position.set(sx, -0.4, sz);
  ships.push(s);
}
function updateShips(dt) {
  for (let i = ships.length - 1; i >= 0; i--) {
    const s = ships[i];
    if (s.state === 'dock') {
      s.timer -= dt;
      if (s.timer <= 0) {
        s.state = 'leave';
        s.tx = s.x + s.port.out.x * 550; s.tz = s.z + s.port.out.z * 550;
      }
      continue;
    }
    const dx = s.tx - s.x, dz = s.tz - s.z, d = Math.hypot(dx, dz);
    const step = s.speed * dt;
    if (d <= step) {
      s.x = s.tx; s.z = s.tz;
      if (s.state === 'sail') {
        // berthed: unload every order it carried, then sail back out
        s.state = 'dock'; s.timer = SHIP_DOCK_T;
        for (const o of s.orders) if (o.stage === 'onShip') o.stage = 'atDock';
        s.orders = [];
        toast(`${s.port.name} port — cargo ship docked`, '#7fb2ff');
      } else {
        scene.remove(s.grp); ships.splice(i, 1);
      }
      continue;
    }
    s.x += dx / d * step; s.z += dz / d * step;
    s.grp.position.set(s.x, -0.4, s.z);
    s.grp.rotation.y = Math.atan2(dx, dz);
  }
}

// hub trucks: a different truck model that ferries docked orders
// pier -> truck hub so supply trucks can take them into the city
const HUBTRUCK_CAP = 3;

// hand-built polyline path for the pier run (no graph edges on the coast)
function pierPath(port, toDock) {
  const pts = toDock
    ? [port.hub, port.mid, port.dock]
    : [port.dock, port.mid, port.hub];
  const legs = [];
  for (let i = 0; i < pts.length - 1; i++)
    legs.push({
      a: new THREE.Vector3(pts[i].x, 0.06, pts[i].z),
      b: new THREE.Vector3(pts[i + 1].x, 0.06, pts[i + 1].z),
      edge: null, eidx: 0
    });
  const cum = [0]; let t = 0;
  for (const l of legs) { t += l.a.distanceTo(l.b); cum.push(t); }
  return { legs, cum, total: t, edgeList: [], slows: [] };
}

function spawnHubTruck(port) {
  const grp = new THREE.Group();
  grp.add(mspawn('car:truck', { target: 9, dim: 'z' }));
  addGlowRing(grp, 4.2);
  scene.add(grp);
  const c = {
    grp, path: null, s: 0, li: 0, speed: 0, vmax: hubTruckSpeed(port),
    edge: null, px: port.hub.x, pz: port.hub.z, dx: 0, dz: 1, yaw: 0,
    stuck: 0, yieldLatch: false,
    role: 'hubtruck', state: 'idleHub', cargo: [], port, vlen: 9
  };
  grp.position.set(port.hub.x, 0.06, port.hub.z);
  cars.push(c);
  addInspectDot(c);
}
function sendHubTruck(c) {
  c.state = 'toDock'; c.cargo = [];
  c.path = pierPath(c.port, true); c.s = 0; c.li = 0; c.speed = 0; c.edge = null;
  c.stuck = 0; c.yieldLatch = false;
}
function hubTruckArrive(c) {
  if (c.state === 'toDock') {
    // load whatever the ship unloaded, then run it to the truck hub
    for (const o of orders) {
      if (o.stage === 'atDock' && PORTS[o.port] === c.port &&
          c.cargo.length < hubTruckCap(c.port)) {
        o.stage = 'onHubTruck'; c.cargo.push(o);
      }
    }
    c.state = 'toHub';
    c.path = pierPath(c.port, false); c.s = 0; c.li = 0; c.speed = 0; c.edge = null;
    c.stuck = 0; c.yieldLatch = false;
    return;
  }
  if (c.state === 'toHub') {
    // back at the port hub with cargo — continue overland to the truck hub
    const thNode = nearestNode(THUB.x, THUB.z);
    const route = bfsPath(c.port.node, thNode);
    const p = route && buildLegs(route, { x: c.px, z: c.pz });
    if (!p) {   // no road route: leave the load at the port hub as before
      for (const o of c.cargo) o.stage = 'atHub';
      c.cargo = []; c.state = 'idleHub'; c.path = null; c.speed = 0;
      return;
    }
    appendLeg(p, THUB.x, THUB.z + 14);
    c.state = 'toTH';
    c.path = p; c.s = 0; c.li = 0; c.speed = 0; c.edge = null;
    c.stuck = 0; c.yieldLatch = false;
    return;
  }
  if (c.state === 'toTH') {
    // delivered at the truck hub — head back to this port's hub and idle
    for (const o of c.cargo) o.stage = 'atTH';
    c.cargo = [];
    const p = routeFrom(c, c.port.node);
    c.state = 'toPort';
    if (p) {
      appendLeg(p, c.port.hub.x, c.port.hub.z);
      c.path = p; c.s = 0; c.li = 0; c.speed = 0; c.edge = null;
      c.stuck = 0; c.yieldLatch = false;
    } else { c.state = 'idleHub'; c.path = null; c.speed = 0; }
    return;
  }
  // 'toPort' arrival: back home, wait for the next ship
  c.state = 'idleHub'; c.path = null; c.speed = 0;
}

/* ================= ROAD REPAIR: trucks fix closed road events ================= */
function repairStall(i) {
  return { x: RH.x - 9 + i * 9, z: RH.z + 15 };
}
function spawnRepairTruck(i) {
  const s = repairStall(i);
  const grp = new THREE.Group();

    stuck: 0, yieldLatch: false,

  };

// send an idle repair truck to a closed-road event
function sendRepairTruck(c, ev) {
  const e0 = ev.edges[0];
  const da = Math.hypot(nodes[e0.a].x - RH.x, nodes[e0.a].z - RH.z);
  const db = Math.hypot(nodes[e0.b].x - RH.x, nodes[e0.b].z - RH.z);
  const route = bfsPath(RH.node, da <= db ? e0.a : e0.b);
  if (!route) return false;
  const p = buildLegs(route, { x: c.px, z: c.pz });
  if (!p) return false;
  appendLeg(p, ev.parkX, ev.parkZ);          // pull onto the closed lane
  c.path = p; c.s = 0; c.li = 0; c.speed = 0; c.edge = null;
  c.stuck = 0; c.yieldLatch = false;
  c.state = 'toScene'; c.ev = ev; c.idle = false;
  return true;
}
function sendRepairHome(c) {
  const p = routeFrom(c, RH.node);
  if (p) {
    const s = repairStall(c.stall);
    appendLeg(p, s.x, s.z);
    c.path = p; c.s = 0; c.li = 0; c.speed = 0; c.edge = null;
    c.stuck = 0; c.yieldLatch = false; c.state = 'returning';
  } else { c.state = 'idle'; c.idle = true; c.path = null; }
}
function repairArrive(c) {
  const ev = c.ev;
  if (c.state === 'toScene') {
    c.path = null; c.speed = 0;
    if (ev && ev.stage === 'active') {
      c.state = 'repairing'; c.repairT = REPAIR_TIME;   // 5s on site
    } else sendRepairHome(c);                            // event already cleared
    return;
  }
  if (c.state === 'returning') {           // back at the depot stall
    c.state = 'idle'; c.idle = true; c.ev = null;
    const s = repairStall(c.stall);
    c.grp.position.set(s.x, 0.06, s.z);
    c.px = s.x; c.pz = s.z;
  }
}
function finishRepair(c) {
  const ev = c.ev; c.ev = null;
  if (ev && ev.stage === 'active') {
    reopenEvent(ev);                        // lifts closures, clears debris
    RH.repairs++;
    toast('Road repaired — reopened', '#7dff9a');
  }
  sendRepairHome(c);
}
// keep the fleet staffed and dispatch idle trucks to closed roads
function updateRepairs(dt) {
  if (!RH.unlocked) return;
  let n = 0;
  for (const c of cars) if (c.role === 'repair') n++;
  while (n < MAX_REPAIR) { spawnRepairTruck(n); n++; }
  for (const c of cars) {
    if (c.role !== 'repair' || c.state !== 'idle') continue;
    const ev = roadEvents.find(e => e.type !== 'festival' &&
      e.stage === 'active' && !e.repairTruck);
    if (!ev) break;
    if (sendRepairTruck(c, ev)) ev.repairTruck = c;
  }
  for (const c of cars)
    if (c.role === 'repair' && c.state === 'repairing') {
      c.repairT -= dt;
      if (c.repairT <= 0) finishRepair(c);
    }
}

// riders park in a row inside the block in front of the warehouse dock,
// each in its own slot so karts don't stack
function riderParkPos(i) {

// rider rarity tiers — speed and parcel capacity scale with rarity/cost
const RIDER_TIERS = [
  { name: 'Common',    color: '#cfe2f5', w: 45, spd: [9, 11],   cap: [4, 6],   cost: 150 },
  { name: 'Uncommon',  color: '#7fe08a', w: 28, spd: [11, 13],  cap: [6, 8],   cost: 300 },
  { name: 'Rare',      color: '#5fb2ff', w: 15, spd: [13, 15],  cap: [8, 10],  cost: 600 },
  { name: 'Epic',      color: '#c58bff', w: 9,  spd: [15, 17],  cap: [10, 12], cost: 1200 },
  { name: 'Legendary', color: '#ffb340', w: 3,  spd: [17, 20],  cap: [12, 15], cost: 2500 },
];
const RIDER_NAMES = ['Bolt', 'Dash', 'Zip', 'Comet', 'Blaze', 'Echo', 'Jett',
  'Kip', 'Luna', 'Milo', 'Nix', 'Onyx', 'Pip', 'Quinn', 'Rex', 'Sky',
  'Tess', 'Uma', 'Vex', 'Wes'];
function rollCandidate() {
  let r = rng() * 100, acc = 0, tier = RIDER_TIERS[0];
  for (const t of RIDER_TIERS) { acc += t.w; if (r < acc) { tier = t; break; } }
  const ri = (a, b) => a + ((rng() * (b - a + 1)) | 0);
  return {
    name: RIDER_NAMES[(rng() * RIDER_NAMES.length) | 0] +
          ' ' + String.fromCharCode(65 + ((rng() * 26) | 0)),
    tier, speed: ri(tier.spd[0], tier.spd[1]),
    cap: ri(tier.cap[0], tier.cap[1]), cost: tier.cost
  };
}
const MAX_RIDERS = 10;
// each hire roll costs cash up front and gets pricier every roll;
// whatever rider you roll is yours — no extra hire fee
let rollSeq = 0;
const rollCost = () => 100 * (rollSeq + 1);

// ---- rider XP / levels (cap 100): each level nudges speed & parcel cap up,
// deliberately tiny — at level 100 the bonuses max out at +5 speed / +30 cap
const RIDER_MAX_LEVEL = 100;
const XP_PARCEL = 6, XP_FOOD = 20, XP_HURRY = 1.5;  // on-time XP multiplier
const TIP_ON_TIME = 0.2, TIP_LATE = 0.05;          // tip as fraction of pay
const xpNeed = lvl => 15 * lvl;                    // xp required lvl -> lvl+1
const lvlSpeedBonus = lvl => Math.floor(lvl * 0.05);
const lvlCapBonus = lvl => Math.floor(lvl * 0.3);
function applyRiderLevel(c) {
  c.vmax = c.def.speed + lvlSpeedBonus(c.level);
  c.cap = c.def.cap + lvlCapBonus(c.level);
}
function awardXp(c, amt) {
  if (c.level >= RIDER_MAX_LEVEL) return;
  c.xp += amt;
  let ups = 0;
  while (c.level < RIDER_MAX_LEVEL && c.xp >= xpNeed(c.level)) {
    c.xp -= xpNeed(c.level); c.level++; ups++;
  }
  if (ups) {
    applyRiderLevel(c);
    floatPop(c.px, c.pz, `LEVEL UP! Lv ${c.level}`, '#ffd27a');
    toast(`${c.def.name} reached level ${c.level}`, '#ffd27a');
  }
}
// per-delivery stats: avg door-to-door time + parcels delivered today
function riderStat(c, secs, parcels) {
  c.timeSum = (c.timeSum || 0) + secs;
  c.timeN = (c.timeN || 0) + 1;
  if (parcels) c.dayParcels = (c.dayParcels || 0) + parcels;
}

function goStop(c, stop) {

function makePerson() {
